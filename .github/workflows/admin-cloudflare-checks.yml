name: Cloudflare administrator console checks

on:
  pull_request:
    paths: ['server/admin-cloudflare/**', '.github/workflows/admin-*.yml']
  push:
    branches: [main]
    paths: ['server/admin-cloudflare/**', '.github/workflows/admin-*.yml']

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server/admin-cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/admin-cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - run: npm run build -- --config wrangler.example.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test:runtime
      - uses: actions/upload-artifact@v4
        with:
          name: OracleProxy-Admin-0.1.0-Source-and-Worker
          path: |
            server/admin-cloudflare/dist/
            server/admin-cloudflare/public/
            server/admin-cloudflare/migrations/
            server/admin-cloudflare/src/
            server/admin-cloudflare/test/
            server/admin-cloudflare/package.json
            server/admin-cloudflare/package-lock.json
            server/admin-cloudflare/wrangler.example.jsonc
            server/admin-cloudflare/collect.py
            server/admin-cloudflare/configure.py
            server/admin-cloudflare/README.md
          retention-days: 14
