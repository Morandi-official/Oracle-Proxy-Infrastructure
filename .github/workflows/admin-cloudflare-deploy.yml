name: Deploy Cloudflare administrator console

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-admin
    defaults:
      run:
        working-directory: server/admin-cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PUBLIC_ORIGIN: ${{ vars.ADMIN_PUBLIC_ORIGIN }}
      ADMIN_ACCESS_ISSUER: ${{ vars.ADMIN_ACCESS_ISSUER }}
      ADMIN_ACCESS_AUD: ${{ vars.ADMIN_ACCESS_AUD }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ADMIN_D1_DATABASE_ID: ${{ vars.ADMIN_D1_DATABASE_ID }}
      ADMIN_NODE_ID: oracle-primary
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/admin-cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 configure.py
      - name: Apply additive D1 migrations
        run: npx --no-install wrangler d1 migrations apply oracle-proxy-admin --remote --config wrangler.jsonc
      - name: Deploy fail-closed code before configuring first ingestion key
        run: npm run deploy -- --config wrangler.jsonc
      - name: Configure dedicated report verification key
        shell: bash
        env:
          INGEST_KEY: ${{ secrets.ADMIN_INGEST_HMAC_KEY }}
        run: |
          set -euo pipefail
          [[ "$INGEST_KEY" =~ ^[a-f0-9]{64}$ ]] || exit 2
          printf '%s' "$INGEST_KEY" | npx --no-install wrangler secret put INGEST_HMAC_KEY --config wrangler.jsonc
