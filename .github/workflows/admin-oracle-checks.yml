name: Oracle self-hosted administrator console checks

on:
  pull_request:
    paths: ['server/admin-oracle/**', 'ops/oracle-project/**', '.github/workflows/admin-*.yml', '.github/workflows/oracle-project-ops.yml']
  push:
    branches: [main]
    paths: ['server/admin-oracle/**', 'ops/oracle-project/**', '.github/workflows/admin-*.yml', '.github/workflows/oracle-project-ops.yml']

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: server/admin-oracle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/admin-oracle/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput --settings config.test_settings
      - run: python manage.py check --deploy --fail-level WARNING --settings config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings config.test_settings
      - run: python manage.py test console --settings config.test_settings --verbosity 2
      - run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - run: python -m unittest discover -s ../../ops/oracle-project -p 'test_*.py' -v
      - run: python -m unittest discover -s control -p 'test_*.py' -v
      - run: python -m unittest discover -s relay -p 'test_*.py' -v
      - run: node --check static/console/app.js
      - name: Package source without test-only privileged entrypoints or credentials
        if: matrix.python == '3.12'
        run: python deploy/package.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: OracleProxy-Admin-Oracle-SelfHosted
          path: server/admin-oracle/dist/*
          retention-days: 14
          if-no-files-found: error
  management-browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium firefox
      - name: Synthetic management UI with real persistent policy engine
        run: python ops/oracle-project/management_ui_acceptance.py
  disposable-host-lifecycle:
    if: github.event.repository.private == false && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies on disposable runner only
        run: sudo apt-get update && sudo apt-get install -y caddy python3-venv openssh-server wireguard-tools ipset iproute2 iptables
      - name: Validate HTTPS reverse proxy configuration
        run: caddy validate --config server/admin-oracle/deploy/Caddyfile --adapter caddyfile
      - name: Real non-root systemd lifecycle, failed startup recovery, and rollback
        env:
          ORACLE_ADMIN_DISPOSABLE_CI: '1'
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" ORACLE_ADMIN_DISPOSABLE_CI=1 \
            python3 server/admin-oracle/deploy/ci_smoke.py
      - name: Real SSH forced-command authentication and sudo boundary
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" ORACLE_ADMIN_DISPOSABLE_CI=1 \
            python3 ops/oracle-project/ci_ssh_smoke.py
      - name: Real policy service, authenticated local socket, and isolated dual-stack WireGuard restrictions
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" ORACLE_ADMIN_DISPOSABLE_CI=1 \
            python3 server/admin-oracle/deploy/ci_control_smoke.py
