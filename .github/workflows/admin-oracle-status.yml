name: Forward restricted Oracle status to administrator console

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-admin-status
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: oracle-ops
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only the deployed agent, then forward a signed status report
        shell: bash
        env:
          CI_KEY: ${{ secrets.ORACLE_CI_OPS_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_CI_KNOWN_HOSTS }}
          ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
          ADMIN_INGEST_HMAC_KEY: ${{ secrets.ADMIN_INGEST_HMAC_KEY }}
          ADMIN_NODE_ID: oracle-primary
        run: |
          set -euo pipefail
          [[ -n "$CI_KEY" && -n "$KNOWN_HOSTS" && -n "$ADMIN_INGEST_URL" ]] || exit 2
          credential_dir=$(mktemp -d "$RUNNER_TEMP/oracle-admin-XXXXXX")
          chmod 700 "$credential_dir"
          trap 'rm -rf -- "$credential_dir"' EXIT
          umask 077
          printf '%s\n' "$CI_KEY" > "$credential_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$credential_dir/known_hosts"
          unset CI_KEY KNOWN_HOSTS
          ssh -T -i "$credential_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$credential_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            oracle-ci@152.67.156.100 agent-status \
            | python3 server/admin-cloudflare/collect.py
