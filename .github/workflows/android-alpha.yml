name: Android WireGuard alpha build

on:
  pull_request:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check runner Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android API 35
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run host-side tests
        working-directory: clients/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK with official WireGuard tunnel library
        working-directory: clients/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Check debug APK exists
        run: |
          test -s clients/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum clients/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned-release / debug-only Android package
        uses: actions/upload-artifact@v4
        with:
          name: oracle-proxy-android-alpha-debug-apk
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
