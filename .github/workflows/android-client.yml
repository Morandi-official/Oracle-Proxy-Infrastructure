name: Android client build and acceptance

on:
  pull_request:
    paths: ['clients/android/**', '.github/workflows/android-client.yml']
  push:
    branches: [main]
    paths: ['clients/android/**', '.github/workflows/android-client.yml']
  workflow_dispatch:
    inputs:
      production_acceptance:
        description: Verify the signed Android package on production
        type: boolean
        default: false
      publish:
        description: Publish a signed APK after Android acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      publish_on_push: ${{ steps.release-request.outputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: release-request
        name: Detect a WireGuard Android release on main
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main &&
            "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            previous=$(git show "$BEFORE:clients/android/app/build.gradle")
            previous_code=$(awk '$1 == "versionCode" && $2 == "=" { print $3 }' <<< "$previous")
            current_code=$(awk '$1 == "versionCode" && $2 == "=" { print $3 }' app/build.gradle)
            previous_name=$(awk '$1 == "versionName" && $2 == "=" { print $3 }' <<< "$previous")
            current_name=$(awk '$1 == "versionName" && $2 == "=" { print $3 }' app/build.gradle)
            if [[ "$previous_code" =~ ^[1-9][0-9]{0,8}$ && "$current_code" =~ ^[1-9][0-9]{0,8}$ &&
              "$current_code" -gt "$previous_code" && "$current_name" != "$previous_name" ]]; then
              publish=true
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Build debug and instrumentation APKs
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
          python3 native/build_tunnel.py verify-apk app/build/wireguard-native/tunnel.aar app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            clients/android/app/build/outputs/apk/debug/app-debug.apk
            clients/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: android-test-apks
      - name: Exercise a real VPN against an isolated Linux WireGuard peer
        run: >-
          bash clients/android/ci/android-emulator-test.sh ${{ matrix.api }}
          android-test-apks/debug/app-debug.apk
          android-test-apks/androidTest/debug/app-debug-androidTest.apk

  signed-release:
    needs: [build, emulator]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.production_acceptance)))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: android-release
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Verify and compile the WireGuard libraries before loading signing credentials
        run: gradle --no-daemon :app:prepareWireGuardTunnel
      - name: Build owner-signed Android APK and matching test APK
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_B64" || -z "$ANDROID_SIGNING_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo 'Android release signing requires the four owner-managed signing secrets.' >&2
            exit 1
          fi
          umask 077
          export ANDROID_SIGNING_STORE_PATH="$(mktemp)"
          trap 'rm -f -- "$ANDROID_SIGNING_STORE_PATH"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$ANDROID_SIGNING_STORE_PATH"
          unset ANDROID_SIGNING_KEYSTORE_B64
          gradle --no-daemon -PproxyTestRelease=true :app:assembleRelease :app:assembleReleaseAndroidTest
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --min-sdk-version 29 --print-certs app/build/outputs/apk/release/app-release.apk
          python3 native/build_tunnel.py verify-apk app/build/wireguard-native/tunnel.aar app/build/outputs/apk/release/app-release.apk
          "$tools/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          mkdir release
          version=$("$tools/aapt" dump badging app/build/outputs/apk/release/app-release.apk |
            sed -n "1s/.*versionName='\([0-9.]*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp app/build/outputs/apk/release/app-release.apk release/Proxy-Android.apk
          printf '%s\n' "$version" > release/version.txt
          (cd release && sha256sum Proxy-Android.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: owner-signed-android
          path: clients/android/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: owner-signed-instrumentation
          path: clients/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error

  signed-emulator:
    needs: signed-release
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: owner-signed-android
          path: owner-signed-android
      - uses: actions/download-artifact@v4
        with:
          name: owner-signed-instrumentation
          path: owner-signed-instrumentation
      - name: Download and verify the previous signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir previous-android
          gh release download wireguard-android-v0.2.0 --pattern Proxy-Android.apk --dir previous-android
          printf '%s  %s\n' 8a05c39b893a282e19b3207dda1f7e8fce249a01eb1ce25af12944a06dc9d972 \
            previous-android/Proxy-Android.apk | sha256sum -c -
      - name: Validate the exact APK after an in-place upgrade
        env:
          ANDROID_UPGRADE_FROM_APK: previous-android/Proxy-Android.apk
        run: |
          (cd owner-signed-android && sha256sum -c SHA256SUMS.txt)
          bash clients/android/ci/android-emulator-test.sh ${{ matrix.api }} \
            owner-signed-android/Proxy-Android.apk owner-signed-instrumentation/app-release-androidTest.apk

  production-emulator:
    needs: signed-release
    outputs:
      latency_met: ${{ steps.production.outputs.latency_met }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment: windows-client-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: owner-signed-android
          path: owner-signed-android
      - uses: actions/download-artifact@v4
        with:
          name: owner-signed-instrumentation
          path: owner-signed-instrumentation
      - id: production
        name: Verify production account and VPN using the signed APK
        env:
          ANDROID_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ANDROID_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: |
          (cd owner-signed-android && sha256sum -c SHA256SUMS.txt)
          bash clients/android/ci/android-emulator-test.sh 36 \
            owner-signed-android/Proxy-Android.apk owner-signed-instrumentation/app-release-androidTest.apk production

  publish:
    needs: [build, signed-emulator, production-emulator]
    if: >-
      github.ref == 'refs/heads/main' && needs.production-emulator.result == 'success' &&
      ((github.event_name == 'push' && needs.build.outputs.publish_on_push == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: owner-signed-android
          path: owner-signed-android
      - name: Publish the tested APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATENCY_MET: ${{ needs.production-emulator.outputs.latency_met }}
        working-directory: owner-signed-android
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          version=$(cat version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          title="Proxy WireGuard Android $version"
          flags=()
          case "$LATENCY_MET" in
            true) timing='The initial VPN confirmation and all five reconnects met the one-second verified connection target.' ;;
            false)
              title="$title · 性能预览版"
              flags+=(--prerelease)
              timing='This performance preview missed the one-second verified connection target in at least one measured connection.'
              ;;
            *) echo 'Missing verified Android connection timing.' >&2; exit 1 ;;
          esac
          notes="The signed APK passed an in-place upgrade from v0.2.0 and WireGuard tests on Android API 29 and 36. Production verification covered login, enrollment, WireGuard, DNS, disconnect and isolated test-device cleanup. All 48 verified UDP round trips met 500 ms on idle and loaded paths. $timing Requires Android 10 or later."
          printf '%s\n\n[Cloud acceptance run](https://github.com/%s/actions/runs/%s)\n' "$notes" "$GH_REPO" "$GITHUB_RUN_ID" > release-notes.md
          gh release create "wireguard-android-v$version" Proxy-Android.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$title" --latest=false --notes-file release-notes.md "${flags[@]}"
