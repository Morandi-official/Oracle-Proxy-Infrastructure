name: Read-only FlClash endpoint diagnosis
on:
  pull_request:
    paths: ['.github/workflows/flclash-endpoint-observation.yml']
permissions:
  contents: read
jobs:
  public-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check admin DNS, TLS, and both public HTTPS origins
        shell: bash
        run: |
          host=vpn-admin.morandi.dpdns.org
          getent ahostsv4 "$host" | awk '{print $1}' | sort -u
          for origin in dns 152.67.154.225 150.230.113.158; do
            args=()
            if [[ "$origin" != dns ]]; then args=(--resolve "$host:443:$origin"); fi
            curl --ipv4 --silent --show-error --connect-timeout 5 --max-time 10 "${args[@]}" \
              --output /dev/null --write-out "origin=$origin HTTP=%{http_code} TLS=%{ssl_verify_result}\n" \
              "https://$host/api/health" || true
          done
