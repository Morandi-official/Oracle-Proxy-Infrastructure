name: Verify a production-issued FlClash profile
on:
  push:
    branches: [main]
    paths: [.github/workflows/flclash-issued-profile-check.yml]
permissions:
  contents: read
concurrency:
  group: flclash-issued-profile-check
  cancel-in-progress: false
jobs:
  issued-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: oracle-ops
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Mihomo
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/mihomo-1.19.33.gz"
          curl --fail --location --retry 2 --max-time 90 -o "$candidate" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-v1.19.33.gz
          echo "8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524  $candidate" | sha256sum --check --status
          gzip -dc "$candidate" > "$RUNNER_TEMP/mihomo-1.19.33"
          chmod 700 "$RUNNER_TEMP/mihomo-1.19.33"
      - name: Issue, download, connect, and retire a backup-only profile
        env:
          ADMIN_LOCAL_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_ADMIN_LOCAL_USERNAME }}
          ADMIN_LOCAL_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_ADMIN_LOCAL_PASSWORD }}
        run: python3 ops/flclash-diagnosis/issued_profile.py "$RUNNER_TEMP/mihomo-1.19.33"
  windows-flclash:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: oracle-ops
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Windows Mihomo and Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'flclash-windows'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $mihomo = Join-Path $dir 'mihomo.zip'
          $wintun = Join-Path $dir 'wintun.zip'
          Invoke-WebRequest 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-windows-amd64-v1-v1.19.33.zip' -OutFile $mihomo
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wintun
          if ((Get-FileHash $mihomo).Hash -ne 'fb0b960eff568459502d4ebe53e9cca203053d86ec9024fe935f19615d74d9aa') { throw 'Mihomo digest mismatch' }
          if ((Get-FileHash $wintun).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun digest mismatch' }
          Expand-Archive $mihomo (Join-Path $dir 'core')
          Expand-Archive $wintun (Join-Path $dir 'driver')
          $exes = @(Get-ChildItem (Join-Path $dir 'core') -Recurse -Filter '*.exe')
          if ($exes.Count -ne 1) { throw 'Expected exactly one Mihomo executable' }
          Copy-Item (Join-Path $dir 'driver/wintun/bin/amd64/wintun.dll') $exes[0].DirectoryName -Force
          "FLCLASH_MIHOMO=$($exes[0].FullName)" >> $env:GITHUB_ENV
      - name: Compare proxy-only and Windows TUN with a temporary backup-only profile
        shell: pwsh
        env:
          ADMIN_LOCAL_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_ADMIN_LOCAL_USERNAME }}
          ADMIN_LOCAL_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_ADMIN_LOCAL_PASSWORD }}
          TEST_FLCLASH_WINDOWS_TUN: '1'
        run: python ops/flclash-diagnosis/issued_profile.py "$env:FLCLASH_MIHOMO"
