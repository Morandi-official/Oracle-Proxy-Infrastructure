name: FlClash cloud observation after rc43 publication
on:
  workflow_run:
    workflows: ['Publish verified Windows rc43 prerelease']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  flclash-cloud-observation:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: windows-client-acceptance
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install WireGuard key tooling and pinned Mihomo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y wireguard-tools
          candidate="$RUNNER_TEMP/mihomo-1.19.33.gz"
          curl --fail --location --retry 2 --max-time 90 -o "$candidate" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1-v1.19.33.gz
          echo "8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524  $candidate" | sha256sum --check --status
          gzip -dc "$candidate" > "$RUNNER_TEMP/mihomo-1.19.33"
          chmod 700 "$RUNNER_TEMP/mihomo-1.19.33"
      - name: Compare numeric HTTPS and hostname HTTPS through a CI-owned peer
        env:
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: python3 ops/distribution/flclash_live_probe.py "$RUNNER_TEMP/mihomo-1.19.33"
