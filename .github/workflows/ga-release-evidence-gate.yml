name: GA release evidence integrity gate (not an attestation)

on:
  pull_request:
    paths:
      - 'release/**'
      - '.github/workflows/ga-release-evidence-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests reject fabricated completion flags
        run: python3 -m unittest discover -s release -p 'test_*.py' -v
      - name: Fail closed if no verifiable release evidence
        shell: bash
        run: |
          if python3 release/check_evidence.py; then
            echo 'Evidence files supplied. Human security signoff is still required.'
          else
            echo 'BLOCKED: production GA not ready; do not create a v1.0.0 release.'
          fi
          # This PR is a development test: expected release BLOCKED state must
          # never be advertised as a passing production readiness decision.
          if test ! -f release/ga-evidence.json; then
            echo 'Expected test fixture state: GA_BLOCKED'
          fi
