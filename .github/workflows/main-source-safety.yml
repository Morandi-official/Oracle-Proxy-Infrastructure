name: Default branch non-VPN source and release safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-ga-without-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release guard negative regression tests
        run: python3 -m unittest discover -s release -p 'test_*.py' -v
      - name: No unsupported production release claims
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release/ga-evidence.json ]]; then
            echo 'FAIL: unaudited GA evidence manifest present in baseline' >&2
            exit 1
          fi
          if python3 release/check_evidence.py; then
            echo 'FAIL: GA gate incorrectly allowed unverified source' >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(key|pem|pfx|p12|conf)$'; then
            echo 'FAIL: candidate key, credential or tunnel config in source tree' >&2
            exit 1
          fi
          echo 'MAIN_SOURCE_GUARD_PASS: baseline is not an authorized VPN release'
  windows-build-only:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build immutable read-only Windows release-channel code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/main-readonly-manager
          if ($LASTEXITCODE -ne 0) { throw 'Main manager build failure' }
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:EnableDisposableLabControls=false -o ./dist/main-readonly-gui
          if ($LASTEXITCODE -ne 0) { throw 'Main GUI build failure' }
          foreach ($fname in @('tunnel.dll','wireguard.dll','OracleProxy.WireGuardHost.exe')) {
            if (@(Get-ChildItem ./dist/main-readonly-manager,./dist/main-readonly-gui -File -Recurse | Where-Object Name -eq $fname).Count -gt 0) {
              throw 'Unexpected native engine in read-only build'
            }
          }
      - name: Existing manager protocol and offline planner tests
        shell: pwsh
        run: |
          $exe = './dist/main-readonly-manager/OracleProxy.LabManager.exe'
          & $exe --ipc-self-test
          if ($LASTEXITCODE -ne 0) { throw 'OS identity status IPC test failed' }
          & $exe --offline-intent-planner-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Offline state model failed' }
          # Even spoofing environment hints cannot add an omitted compile unit.
          $env:GITHUB_ACTIONS = 'true'
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          & $exe --admin-lab-self-test
          if ($LASTEXITCODE -ne 2) { throw 'Default manager accepted forbidden lab-test entrypoint' }
          & $exe --manager-service --ci-lab-control
          if ($LASTEXITCODE -ne 2) { throw 'Default manager accepted privileged tunnel service entrypoint' }
          Write-Host 'MAIN_WINDOWS_SOURCE_PASS: read-only executable, no SCM install/route/DNS/WFP modifications'
          # Explicit negative tests leave a native LASTEXITCODE=2; neutralize after all assertions.
          exit 0
