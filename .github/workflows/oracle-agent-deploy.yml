name: Oracle Diagnostic Agent Delivery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select an approved agent operation
        type: choice
        required: true
        default: agent-status
        options:
          - agent-status
          - deploy-agent
          - rollback-agent

permissions:
  contents: read

concurrency:
  group: oracle-ci-agent
  cancel-in-progress: false

jobs:
  agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: oracle-ops
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restricted diagnostics delivery
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_CI_OPS_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_CI_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 2
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 2
          case "$OPERATION" in agent-status|deploy-agent|rollback-agent) ;; *) exit 2;; esac
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle_ci_ops"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          trap 'rm -f "$HOME/.ssh/oracle_ci_ops" "$HOME/.ssh/known_hosts"' EXIT
          SSH=(ssh -T -i "$HOME/.ssh/oracle_ci_ops" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=10
            -o ServerAliveCountMax=2 oracle-ci@152.67.156.100)
          if [[ "$OPERATION" == deploy-agent ]]; then
            script=ops/oracle-ci/read-only-agent.sh
            test -f "$script"
            test "$(wc -c < "$script")" -le 8192
            bash -n "$script"
            checksum=$(sha256sum "$script" | cut -d' ' -f1)
            "${SSH[@]}" "deploy-agent $REVISION $checksum" < "$script"
          else
            "${SSH[@]}" "$OPERATION"
          fi