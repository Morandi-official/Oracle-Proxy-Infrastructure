name: Oracle CI Read-Write (Restricted)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Authorized Oracle operation'
        required: true
        type: choice
        default: status
        options:
          - status
          - stage
          - rollback

permissions:
  contents: read

jobs:
  oracle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: oracle-ops
    timeout-minutes: 5
    steps:
      - name: Execute a strictly allowlisted Oracle command
        shell: bash
        env:
          CI_KEY: ${{ secrets.ORACLE_CI_OPS_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_CI_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$CI_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Missing environment secrets' >&2; exit 1; }
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || exit 2
          case "$OPERATION" in status|stage|rollback) ;; *) exit 2;; esac
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$CI_KEY" > "$HOME/.ssh/oracle_ci_ops"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          unset CI_KEY KNOWN_HOSTS
          trap 'rm -f "$HOME/.ssh/oracle_ci_ops" "$HOME/.ssh/known_hosts"' EXIT
          SSH=(ssh -T -i "$HOME/.ssh/oracle_ci_ops" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 oracle-ci@152.67.156.100)
          if [[ "$OPERATION" == stage ]]; then
            "${SSH[@]}" "stage $REV"
          else
            "${SSH[@]}" "$OPERATION"
          fi