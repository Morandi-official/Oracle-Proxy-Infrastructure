name: Oracle Project Service Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Limited non-root diagnostic service operation'
        required: true
        type: choice
        default: svc-status
        options:
          - svc-status
          - svc-start
          - svc-stop
          - svc-restart
          - svc-logs

permissions:
  contents: read

concurrency:
  group: oracle-ci-service-ops
  cancel-in-progress: false

jobs:
  oracle-service:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: oracle-ops
    timeout-minutes: 5
    steps:
      - name: Call fixed Oracle service control (one allowlisted unit)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_CI_OPS_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_CI_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            svc-status|svc-start|svc-stop|svc-restart|svc-logs) ;;
            *) echo 'Unapproved operation' >&2; exit 2 ;;
          esac
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 2
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle_ci_ops"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          trap 'rm -f "$HOME/.ssh/oracle_ci_ops" "$HOME/.ssh/known_hosts"' EXIT
          ssh -T -i "$HOME/.ssh/oracle_ci_ops" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            oracle-ci@152.67.156.100 "$OPERATION"
