name: R100 strictly isolated guest NIC lane and independent packet witness (no Windows guest)

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r100/**'
      - 'docs/r100-guest-network-airgap.md'
      - '.github/workflows/r100-airgapped-guest-nic.yml'

permissions:
  contents: read

jobs:
  host-only-isolated-nic:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r100-linux-tap-airgap-preflight-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert zero public route in disposable Linux guest NIC namespace
        shell: bash
        run: bash lab/cloud-windows-r100/run_guest_airgap_preflight.sh
