name: R101 free official Microsoft Windows ISO source and UEFI metadata preflight

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r101/**'
      - 'docs/r101-official-iso-feasibility.md'
      - '.github/workflows/r101-eval-iso-free-readonly.yml'

permissions:
  contents: read

concurrency:
  group: r101-iso-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  official-evaluation-iso-no-install:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r101-official-free-windows-iso-preflight-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only preflight to prevent unsafe ISO download assumptions
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/cloud-windows-r101/official_iso_preflight.sh
          grep -Fq -- 'no-install-recommends' lab/cloud-windows-r101/official_iso_preflight.sh
          grep -Fq -- 'R101_GA_OR_R83_UNLOCK=false' lab/cloud-windows-r101/official_iso_preflight.sh
          echo 'R101_NO_PAID_RUNNER_NEW_CLOUD_OR_WINDOWS_KEY'
      - name: Temporary official Microsoft evaluation ISO inventory only
        shell: bash
        timeout-minutes: 18
        run: bash lab/cloud-windows-r101/official_iso_preflight.sh
