name: R103 offline Windows evaluation ISO WIM image identity index gate

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r103/**'
      - 'docs/r103-wim-index-gate.md'
      - '.github/workflows/r103-wim-index-policy.yml'

permissions:
  contents: read

jobs:
  evaluate-identity-only-without-windows-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic Windows Evaluation WIM index and edition negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s lab/cloud-windows-r103 -p 'test_choose_official_wim_edition.py' -v
          echo R103_OFFICIAL_ISO_EDITION_METADATA_SELECTOR_DENY_ONLY_PASS
          echo R103_REAL_WINDOWS_INSTALL_OR_BOOT_NOT_TESTED
          echo R103_DRIVER_WFP_UU_NOT_TESTED
          echo R103_RELEASE_OR_R83_APPROVAL=false
