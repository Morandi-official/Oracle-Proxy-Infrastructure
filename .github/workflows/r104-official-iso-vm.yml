name: R104 free isolated official Windows ISO first installation and boot witness

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r104/**'
      - 'docs/r104-real-iso-first-boot.md'
      - '.github/workflows/r104-official-iso-vm.yml'

permissions:
  contents: read

concurrency:
  group: r104-free-iso-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-denial-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify installer never connects guest network or bypasses Windows security
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/cloud-windows-r104/run_free_official_iso_install.sh
          grep -Fq -- '-nic none' lab/cloud-windows-r104/run_free_official_iso_install.sh
          grep -Fq -- 'R104_GA_OR_FIELD_R83_UNLOCK=false' lab/cloud-windows-r104/run_free_official_iso_install.sh
          python3 -B -m unittest discover -s lab/cloud-windows-r102 -p 'test_ephemeral_windows_answer.py' -v
          python3 -B -m unittest discover -s lab/cloud-windows-r103 -p 'test_choose_official_wim_edition.py' -v
          echo R104_SOURCE_ONLY_GATES_NO_OS_MUTATION_PASS
  install-only-in-ephemeral-cloud:
    needs: static-denial-checks
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r104-official-iso-first-windows-install-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 66
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free official Microsoft evaluation ISO, isolated no-NIC UEFI install and offline native boot witness
        shell: bash
        timeout-minutes: 62
        run: bash lab/cloud-windows-r104/run_free_official_iso_install.sh
