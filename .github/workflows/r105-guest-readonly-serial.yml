name: R105 future cloud Windows COM1 read-only SYSTEM witness protocol, NO GUEST START

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r105/**'
      - 'docs/r105-guest-serial-witness-protocol.md'
      - '.github/workflows/r105-guest-readonly-serial.yml'

permissions:
  contents: read

jobs:
  pure-host-protocol-negative-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded fresh-nonce and zero-release-authorization semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s lab/cloud-windows-r105 -p 'test_host_verify_serial.py' -v
          echo R105_READONLY_SERIAL_NO_GUEST_OR_OS_MUTATION_PASS
  windows-source-compile-only:
    needs: pure-host-protocol-negative-matrix
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows COM1 future guest witness then self-test only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build ./lab/cloud-windows-r105/OracleProxy.GuestReadOnlyWitness.csproj -c Release -p:RestoreIgnoreFailedSources=true -o ./out/r105-source
          if ($LASTEXITCODE -ne 0) { throw 'R105_WIN32_BUILD_DENIED' }
          dotnet ./out/r105-source/OracleProxy.GuestReadOnlyWitness.dll --self-test
          if ($LASTEXITCODE -ne 0) { throw 'R105_READONLY_PROTOCOL_SELFTEST_DENIED' }
          Write-Host 'R105_NO_COM_PORT_OPENED_NO_SERVICE_OR_DRIVER_LOADED'
          Write-Host 'R105_AUTHENTICATED_WINDOWS_KERNEL_BOOT_NOT_PROVEN'
