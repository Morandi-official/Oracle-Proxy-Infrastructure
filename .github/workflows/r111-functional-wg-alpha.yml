name: R111 unsigned opt-in official WireGuard service GUI functional Alpha, NOT GA

on:
  pull_request:
    paths:
      - 'clients/windows/wg-alpha/**'
      - 'docs/r111-wg-functional-alpha.md'
      - '.github/workflows/r111-functional-wg-alpha.yml'
permissions:
  contents: read

concurrency:
  group: r111-unsigned-local-alpha-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  alpha-local-guard:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r111-standalone-wireguard-vpn-alpha-20261018'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify no service or WFP mutation on hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='WireGuardTunnel$OracleProxyAlphaTest'
          if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
            throw 'R111 existing tunnel; refuse test'
          }
          if (@(Get-NetFirewallRule | Where-Object Name -like 'OracleProxy-R111-*').Count -ne 0) {
            throw 'R111 preexisting forbidden local WFP rule'
          }
          Write-Host 'R111_CI_NO_TUNNEL_OR_WFP_MUTATION_PRECHECK_PASS'
      - name: Compile standalone self-contained Windows GUI (NOT elevated in CI)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish ./clients/windows/wg-alpha/OracleProxy.WgAlpha.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./dist/r111/bin
          if($LASTEXITCODE -ne 0) { throw 'R111 native Windows build failed' }
          $found=@(Get-ChildItem './dist/r111/bin' -File)
          if($found.Count -ne 1 -or $found[0].Name -ne 'OracleProxy.WgAlpha.exe') {
            throw 'R111 exact-one-EXE payload guard failed'
          }
          if((Get-AuthenticodeSignature -LiteralPath $found[0].FullName).Status -ne 'NotSigned') {
            throw 'R111 cannot represent this artifact as publisher signed'
          }
          Write-Host 'R111_NATIVE_UNSIGNED_GUI_BUILT_EXACT_ONE_EXE'
      - name: Native negative self-test no network tunnel, no WFP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path './dist/r111/bin/OracleProxy.WgAlpha.exe').Path
          $test=Start-Process -FilePath $exe -ArgumentList '--offline-self-test' -PassThru -Wait
          if($test.ExitCode -ne 0) { throw 'R111 alpha offline safety refusal matrix failed' }
          $test=Start-Process -FilePath $exe -ArgumentList '--unknown-mutating-arg' -PassThru -Wait
          if($test.ExitCode -ne 2) { throw 'R111 accepted unapproved headless command' }
          if(Get-Service -Name 'WireGuardTunnel$OracleProxyAlphaTest' -ErrorAction SilentlyContinue) {
            throw 'R111 self-tests unexpectedly changed native services'
          }
          if(@(Get-NetFirewallRule | Where-Object Name -like 'OracleProxy-R111-*').Count -ne 0) {
            throw 'R111 self-tests unexpectedly changed WFP'
          }
          Write-Host 'R111_CI_PRIVILEGED_NETWORK_OPERATIONS_NOT_EXECUTED_PASS'
          Write-Host 'R111_REAL_TWO_HOST_HANDSHAKE_WFP_LEAK_PROTECTION_UU_UNTESTED'
      - name: Package dedicated readme-first unsigned Alpha and verify archive hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path (Resolve-Path './dist/r111').Path 'portable'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item './dist/r111/bin/OracleProxy.WgAlpha.exe' -Destination $d
          Copy-Item './docs/r111-wg-functional-alpha.md' -Destination (Join-Path $d 'READ_ME_FIRST.md')
          $names=@('OracleProxy.WgAlpha.exe','READ_ME_FIRST.md')
          $files=@(Get-ChildItem -LiteralPath $d -File)
          if($files.Count -ne 2 -or @($files|Where-Object { $_.Name -notin $names }).Count -ne 0) {
            throw 'R111 unexpected file staged'
          }
          $manifest=@('R111 SHA256 only, not a publisher signature')
          foreach($name in $names) {
            $hash=(Get-FileHash -LiteralPath (Join-Path $d $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest+=($hash+'  '+$name)
          }
          $manifest | Set-Content -LiteralPath (Join-Path $d 'SHA256SUMS.txt') -Encoding utf8
          $zip=Join-Path (Resolve-Path './dist/r111').Path 'OracleProxy-R111-WireGuard-Functional-Alpha-UNSIGNED-NO-KILLSWITCH-GUARANTEE.zip'
          Compress-Archive -Path (Join-Path $d '*') -DestinationPath $zip -CompressionLevel Optimal
          $verify=Join-Path $env:RUNNER_TEMP 'r111-alpha-archive-check'
          Expand-Archive -LiteralPath $zip -DestinationPath $verify
          if(@(Get-ChildItem $verify -File).Count -ne 3){throw 'R111 zip payload count changed'}
          foreach($name in $names) {
            if((Get-FileHash -LiteralPath (Join-Path $verify $name) -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath (Join-Path $d $name) -Algorithm SHA256).Hash){
              throw 'R111 zip hash mismatch'
            }
          }
          Write-Host 'R111_OFFLINE_UNSIGNED_PORTABLE_ALPHA_ZIP_INTEGRITY_PASS'
      - name: Upload experimental Windows GUI only; no driver, config, installer or secrets
        uses: actions/upload-artifact@v4
        with:
          name: OracleProxy-R111-WireGuard-Experimental-Alpha-UNSIGNED-NOT-WireSock-Replacement
          path: ./dist/r111/OracleProxy-R111-WireGuard-Functional-Alpha-UNSIGNED-NO-KILLSWITCH-GUARANTEE.zip
          if-no-files-found: error
          retention-days: 7
