name: R112 bundled official WireGuard engine standalone Windows Alpha (no separate WireGuard app)

on:
  pull_request:
    paths:
      - 'clients/windows/wg-alpha/**'
      - 'docs/r112-integrated-wireguard-alpha.md'
      - '.github/workflows/r112-embedded-wireguard-alpha.yml'
permissions:
  contents: read

concurrency:
  group: r112-standalone-native-engine-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-bundled-alpha:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r112-embedded-wireguard-no-official-install-20261018'
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WireGuard/wireguard-windows
          ref: 6ece77bc487c8aa697e3c092197621c4f3e5ccb8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static negative checks, official EXE not required or linked
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content './clients/windows/wg-alpha/Program.cs' -Raw
          $project=Get-Content './clients/windows/wg-alpha/OracleProxy.WgAlpha.csproj' -Raw
          $bridge=Get-Content './clients/windows/wg-alpha/EmbeddedWireGuardBridge.cs' -Raw
          if ($main -notlike '*EmbeddedWireGuardBridge.RunWindowsService()*' -or
              $main -match 'OfficialWireGuardBridge\.' -or
              $project -notlike '*Compile Remove="OfficialWireGuardBridge.cs"*' -or
              $bridge -notlike '*WireGuardTunnelService*' -or
              $bridge -notlike '*R112_BUILDER_MUST_EMBED_TUNNEL_SHA256*' -or
              $bridge -notlike '*IsTrustedLocalSignature*') {
            throw 'R112 external WireGuard app not removed or embedded native trust gate missing'
          }
          if (Get-Service -Name 'WireGuardTunnel$OracleProxyAlphaTest' -ErrorAction SilentlyContinue) {
            throw 'R112 preexisting foreign tunnel on CI; refuse'
          }
          Write-Host 'R112_NO_EXTERNAL_WIREGUARD_EXE_NO_UNSAFE_GA_BYPASS'
      - name: Download pinned official signed WireGuardNT binary and compiler
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Compile official MIT source embeddable service library
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path './dist/r112/native' | Out-Null
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='1'
          $env:CC=$env:WG_LAB_GCC
          $env:CGO_CFLAGS='-O3 -Wall -Wno-unused-function -Wno-switch -std=gnu11 -DWINVER=0x0A00'
          go -C ./upstream build -overlay .overlay/overlay.json -buildmode c-shared -ldflags="-w -s" -trimpath -o ../dist/r112/native/tunnel.dll ./embeddable-dll-service
          if ($LASTEXITCODE -ne 0 -or !(Test-Path './dist/r112/native/tunnel.dll')) {
            throw 'R112 upstream tunnel.dll build failed'
          }
          $native=(Get-Item './dist/r112/native/tunnel.dll')
          if ($native.Length -lt 100000 -or $native.Length -gt 20000000) { throw 'R112 tunnel.dll unexpected size' }
          Copy-Item -LiteralPath $env:WG_LAB_DLL -Destination './dist/r112/native/wireguard.dll'
          if ((Get-FileHash './dist/r112/native/wireguard.dll' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b1b85e072c45d81358be29d94c599dc76652f912be8c0f0a41e2d5d89a6461d3') {
            throw 'R112 signed upstream driver hash changed'
          }
          if ((Get-AuthenticodeSignature './dist/r112/native/wireguard.dll').Status -ne 'Valid') {
            throw 'R112 upstream signed driver is untrusted'
          }
          Write-Host 'R112_PROJECT_BUILT_UPSTREAM_TUNNEL_AND_SIGNED_DRIVER_VERIFIED'
      - name: Embed actual upstream tunnel DLL hash into native-service executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash './dist/r112/native/tunnel.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $file='./clients/windows/wg-alpha/EmbeddedWireGuardBridge.cs'
          $raw=Get-Content -LiteralPath $file -Raw
          $literal='R112_BUILDER_MUST_EMBED_TUNNEL_SHA256'
          if ($raw.Split(@($literal),[StringSplitOptions]::None).Count -ne 2) {
            throw 'R112 compile-time native DLL pin placeholder not unique'
          }
          $raw=$raw.Replace($literal,$sha)
          [IO.File]::WriteAllText((Resolve-Path $file).Path,$raw,[Text.UTF8Encoding]::new($false))
          if ($raw -notlike "*PinnedTunnelSha256 = `"$sha`"*") { throw 'R112 immutable pin injection failed' }
          Write-Host 'R112_DLL_PIN_COMPILED_INTO_GUI_SERVICE_BINARY_NOT_MUTABLE_MANIFEST'
      - name: Build single product GUI and embedded SCM service executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish ./clients/windows/wg-alpha/OracleProxy.WgAlpha.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o ./dist/r112/exe
          if ($LASTEXITCODE -ne 0) { throw 'R112 native embedded GUI+service build failed' }
          $items=@(Get-ChildItem './dist/r112/exe' -File)
          if($items.Count -ne 1 -or $items[0].Name -ne 'OracleProxy.WgAlpha.exe') {
            throw 'R112 self-contained executable allowlist failed'
          }
          if((Get-AuthenticodeSignature $items[0].FullName).Status -ne 'NotSigned') {
            throw 'R112 dev preview must not be mistaken for signed published vendor release'
          }
          Write-Host 'R112_ONE_CUSTOM_GUI_PLUS_SCM_SERVICE_NO_OFFICIAL_APP'
      - name: Verify actual Windows executable refuses unapproved CLI and non-System native service invocation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path './dist/r112/exe/OracleProxy.WgAlpha.exe').Path
          foreach($case in @(@('--offline-self-test',0),@('--service',3),@('--unexpected-tunnel-start',2))) {
            $p=Start-Process -FilePath $exe -ArgumentList $case[0] -Wait -PassThru
            if($p.ExitCode -ne [int]$case[1]) {
              throw "R112 negative native binary test refused: $($case[0]) exit=$($p.ExitCode)"
            }
          }
          if(Get-Service -Name 'WireGuardTunnel$OracleProxyAlphaTest' -ErrorAction SilentlyContinue){
            throw 'R112 offline self-test touched SCM'
          }
          Write-Host 'R112_LOCAL_WINDOWS_SERVICE_SYSTEM_IDENTITY_REFUSAL_PASS'
          Write-Host 'R112_REAL_INTERNET_PEER_LEAK_FAILCLOSE_RECOVERY_UU_NOT_TESTED'
      - name: Create vetted README-first standalone native package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=(Resolve-Path './dist/r112').Path
          $d=Join-Path $dist 'portable'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item -LiteralPath './dist/r112/exe/OracleProxy.WgAlpha.exe' -Destination $d
          Copy-Item -LiteralPath './dist/r112/native/tunnel.dll' -Destination $d
          Copy-Item -LiteralPath './dist/r112/native/wireguard.dll' -Destination $d
          Copy-Item -LiteralPath './docs/r112-integrated-wireguard-alpha.md' -Destination (Join-Path $d 'READ_ME_FIRST.md')
          # Official prebuilt WireGuardNT binary has a DIFFERENT license than
          # WireGuardNT GPLv2 source. Redistribution requires bundling the
          # EXACT license that arrived with the pinned, official SDK ZIP.
          $sdkRoot=Join-Path $env:RUNNER_TEMP 'wg-sdk'
          $license=@(Get-ChildItem -Path $sdkRoot -Recurse -File |
            Where-Object { $_.Name -eq 'prebuilt-binaries-license.txt' })
          if($license.Count -ne 1) {
            throw 'R112 WireGuardNT official prebuilt binary license missing: refuse redistribution'
          }
          Copy-Item -LiteralPath $license[0].FullName -Destination (Join-Path $d 'WIREGUARDNT_BINARY_LICENSE.txt')
          Copy-Item -LiteralPath './docs/r112-wireguard-embedding-mit-license.txt' -Destination (Join-Path $d 'EMBEDDABLE_TUNNEL_MIT_LICENSE.txt')
          $notices=@(
            'Oracle Proxy R112 unofficial experimental developer package; not endorsed by WireGuard LLC.',
            'tunnel.dll: compiled by this CI from pinned WireGuard/wireguard-windows MIT-licensed embeddable-dll-service source.',
            'wireguard.dll: officially signed WireGuardNT v1.1 AMD64 from the official WireGuardNT SDK ZIP.',
            'WireGuard Windows: https://git.zx2c4.com/wireguard-windows/',
            'WireGuardNT binary terms and original archive: https://download.wireguard.com/wireguard-nt/',
            'Retain upstream notices and licenses; this artifact is NOT a signed production release.',
            'This test package has never demonstrated a real public-server handshake, safe off, WFP fail-close or UU compatibility.'
          )
          $notices | Set-Content -LiteralPath (Join-Path $d 'UPSTREAM_NOTICES.md') -Encoding utf8
          $names=@('OracleProxy.WgAlpha.exe','tunnel.dll','wireguard.dll','READ_ME_FIRST.md','UPSTREAM_NOTICES.md','WIREGUARDNT_BINARY_LICENSE.txt','EMBEDDABLE_TUNNEL_MIT_LICENSE.txt')
          $items=@(Get-ChildItem -LiteralPath $d -File)
          if($items.Count -ne $names.Count -or @($items|Where-Object { $_.Name -notin $names }).Count -ne 0){
            throw 'R112 unexpected native artifact payload'
          }
          $sum=@('R112 SHA256 manifest, NOT a publisher signature')
          foreach($name in $names){
            $sha=(Get-FileHash -LiteralPath (Join-Path $d $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $sum+=("$sha  $name")
          }
          $sum | Set-Content -LiteralPath (Join-Path $d 'SHA256SUMS.txt') -Encoding utf8
          $zip=Join-Path $dist 'OracleProxy-R112-Standalone-WireGuard-Embedded-UNSIGNED-Alpha.zip'
          Compress-Archive -Path (Join-Path $d '*') -DestinationPath $zip -CompressionLevel Optimal
          $check=Join-Path $env:RUNNER_TEMP 'r112-artifact-verify'
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $actual=@(Get-ChildItem -LiteralPath $check -File)
          if($actual.Count -ne 8){throw 'R112 archive file allowlist changed'}
          foreach($name in $names) {
            if((Get-FileHash -LiteralPath (Join-Path $d $name) -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath (Join-Path $check $name) -Algorithm SHA256).Hash) {
               throw 'R112 ZIP hash mismatch'
            }
          }
          Write-Host 'R112_BUNDLED_WINDOWS_APP_WITH_OFFICIAL_PINNED_NATIVE_ENGINE_PACKAGE_PASS'
          Write-Host 'R112_UNSIGNED_NOT_A_WIRESOCK_REPLACEMENT_AND_NO_REAL_TUNNEL_TEST'
      - name: Upload only experimental no-external-installer embedded Alpha
        uses: actions/upload-artifact@v4
        with:
          name: OracleProxy-R112-Standalone-Embedded-WireGuard-UNSIGNED-NO-RealTunnelProof
          path: ./dist/r112/OracleProxy-R112-Standalone-WireGuard-Embedded-UNSIGNED-Alpha.zip
          retention-days: 7
          if-no-files-found: error
