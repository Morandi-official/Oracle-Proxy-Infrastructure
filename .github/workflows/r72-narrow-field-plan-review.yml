name: R72 review-only bounded native public trial proposal validator

on:
  pull_request:
    paths:
      - 'lab/field-windows/r72_narrow_plan.py'
      - 'lab/field-windows/test_r72_narrow_plan.py'
      - '.github/workflows/r72-narrow-field-plan-review.yml'
      - 'docs/r72-narrow-field-plan-preflight.md'
      - 'docs/r71-attended-field-readiness.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-by-default-proposal-validation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r72-narrow-field-manifest-policy-20261017'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative review-only manifest scope tests (NO native install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s lab/field-windows -p 'test_r72_narrow_plan.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R72 negative proposal test failed' }
          python ./lab/field-windows/r72_narrow_plan.py --connect
          if ($LASTEXITCODE -ne 2) { throw 'R72 accepted privileged command' }
          python ./lab/field-windows/r72_narrow_plan.py
          if ($LASTEXITCODE -ne 2) { throw 'R72 allowed implicit operation' }
          Write-Host 'R72_REVIEW_ONLY_POLICY_NEGATIVE_TESTS_PASS'
          exit 0
      - name: Confirm no unattended credential or native connection build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath ./lab/field-windows/r72_narrow_plan.py -Raw -ErrorAction Stop
          foreach ($forbidden in @('subprocess', 'Popen(', 'socket.socket(', 'Start-Service', 'sc.exe create', 'wg-quick up', 'WireGuardTunnel$')) {
            if ($source.Contains($forbidden)) { throw 'R72 reviewer unexpectedly contains mutation primitive' }
          }
          if (Test-Path ./release/ga-evidence.json) { throw 'R72 must not promote GA' }
          Write-Host 'R72_NO_NATIVE_TUNNEL_OR_SYSTEM_MUTATION_PASS'
