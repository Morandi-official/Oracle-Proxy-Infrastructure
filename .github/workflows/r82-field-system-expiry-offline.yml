name: R82 offline synthetic field lease SYSTEM Scheduler expiry without VPN

on:
  pull_request:
    paths:
      - 'clients/windows/lab/Invoke-R82SystemOfflineExpiry.ps1'
      - 'clients/windows/lab/Register-R82OfflineFieldExpiry.ps1'
      - 'clients/windows/lab/Observe-R82OfflineFieldExpiry.ps1'
      - 'clients/windows/lab/Cleanup-R82OfflineFieldTask.ps1'
      - 'clients/windows/lab/Test-R81FieldLeaseStaging.ps1'
      - 'clients/windows/lab/Invoke-R81CleanupOwnedLease.ps1'
      - '.github/workflows/r82-field-system-expiry-offline.yml'
      - 'docs/r82-system-owned-field-lease-expiry-offline.md'

permissions:
  contents: read

jobs:
  os-owned-expiry-no-tunnel:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r82-field-offline-os-owned-expiry-20261017'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ORACLE_R81: CI_ONLY
      ORACLE_R82: CI_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fingerprint OS default routes DNS and firewall before offline staging
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'R82 refuses nonhosted runner'
          }
          $routes=@(Get-NetRoute -ErrorAction Stop | Where-Object DestinationPrefix -in @('0.0.0.0/0','::/0') |
            Select-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric | Sort-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric)
          $dns=@(Get-DnsClientServerAddress -ErrorAction Stop |
            Select-Object InterfaceIndex,AddressFamily,ServerAddresses | Sort-Object InterfaceIndex,AddressFamily)
          $snapshot=([ordered]@{routes=$routes;dns=$dns;firewall_count=@(Get-NetFirewallRule -ErrorAction Stop).Count}|ConvertTo-Json -Compress -Depth 7)
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'r82-os-baseline.json'),$snapshot)
          if (Test-Path (Join-Path $env:ProgramData 'OracleProxyLab')) {
            throw 'R82 refuses pre-existing lab'
          }
          Write-Host 'R82_OS_BASELINE_SAVED_NO_NATIVE_SERVICE_PASS'
      - name: Stage R81 synthetic protected field lease without VPN
        shell: pwsh
        run: ./clients/windows/lab/Test-R81FieldLeaseStaging.ps1
      - name: Independently register one future LocalSystem expiry, then exit
        shell: pwsh
        run: ./clients/windows/lab/Register-R82OfflineFieldExpiry.ps1
      - name: In a later CI step observe Task Scheduler autonomously expire files
        shell: pwsh
        timeout-minutes: 4
        run: ./clients/windows/lab/Observe-R82OfflineFieldExpiry.ps1
      - name: ALWAYS unregister the exact owned SYSTEM scheduled task
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/Cleanup-R82OfflineFieldTask.ps1
      - name: ALWAYS cleanup only R81-owned synthetic lease and private file
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/Invoke-R81CleanupOwnedLease.ps1
      - name: ALWAYS independently compare OS baselines and absence of lab resources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baselinePath=Join-Path $env:RUNNER_TEMP 'r82-os-baseline.json'
          if (!(Test-Path -LiteralPath $baselinePath -PathType Leaf)) {
            throw 'R82 initial OS baseline missing'
          }
          $routes=@(Get-NetRoute -ErrorAction Stop | Where-Object DestinationPrefix -in @('0.0.0.0/0','::/0') |
            Select-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric | Sort-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric)
          $dns=@(Get-DnsClientServerAddress -ErrorAction Stop |
            Select-Object InterfaceIndex,AddressFamily,ServerAddresses | Sort-Object InterfaceIndex,AddressFamily)
          $after=([ordered]@{routes=$routes;dns=$dns;firewall_count=@(Get-NetFirewallRule -ErrorAction Stop).Count}|ConvertTo-Json -Compress -Depth 7)
          if ($after -cne [IO.File]::ReadAllText($baselinePath)) {
            throw 'R82 altered Windows default routes, DNS or firewall inventory'
          }
          if (Test-Path (Join-Path $env:ProgramData 'OracleProxyLab')) {
            throw 'R82 field lease directory persisted'
          }
          if (Get-ScheduledTask -TaskName 'OracleProxy-R82-CI-Field-Offline-Expiry' -ErrorAction SilentlyContinue) {
            throw 'R82 owned task persisted'
          }
          if (Get-Service -Name 'WireGuardTunnel$lab-field' -ErrorAction SilentlyContinue) {
            throw 'R82 unexpectedly created native service'
          }
          Write-Host 'R82_OS_DEFAULTS_DNS_FW_AND_OWNED_RESOURCE_RESTORE_PASS'
