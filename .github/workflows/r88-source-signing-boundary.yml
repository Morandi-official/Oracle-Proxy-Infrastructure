name: R88 Windows source and signing boundary (no field execution)

on:
  pull_request:
    paths:
      - 'release/r88_artifact_policy.py'
      - 'release/test_r88_artifact_policy.py'
      - 'docs/r88-release-provenance-and-policy.md'
      - '.github/workflows/r88-source-signing-boundary.yml'
      - 'clients/windows/r86-field/**'

permissions:
  contents: read

jobs:
  deny-untrusted-production:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source integrity and independent-pin negative tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s release -p 'test_r88_artifact_policy.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R88 source trust negative tests failed' }
          Write-Host 'R88_SOURCE_PIN_AND_TAMPER_REFUSAL_PASS'
      - name: Windows Authenticode proves current R86 scripts are NOT signed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('R86-Common.ps1','R86-Preflight.ps1','R86-Start.ps1',
              'R86-Verify.ps1','R86-EmergencyCleanup.ps1')) {
            $path = Join-Path 'clients/windows/r86-field' $name
            $actual = Get-AuthenticodeSignature -LiteralPath $path -ErrorAction Stop
            if ($actual.Status -ne 'NotSigned') {
              throw "R88 unexpected R86 signing status for $name; manual review required"
            }
          }
          Write-Host 'R88_UNSIGNED_R86_SCRIPTS_NOT_TRUSTED_INSTALLER_PASS'
          Write-Host 'R88_NO_POWERSHELL_POLICY_CHANGE_NO_DRIVER_NO_INSTALL_PASS'
