name: R9 Oracle sidecar read-only suitability probe (CI fixture only)

on:
  pull_request:
    paths:
      - 'lab/oracle-sidecar/**'
      - '.github/workflows/r9-oracle-sidecar-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-lab-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and static negative self-test
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/oracle-sidecar/inspect-read-only.sh
          bash lab/oracle-sidecar/inspect-read-only.sh --self-test
          if bash lab/oracle-sidecar/inspect-read-only.sh --unsafe-activate; then
            echo 'R9 FAIL: read-only script accepted a mutation argument' >&2
            exit 1
          fi
      - name: Run real read-only Linux host API query on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          report="$(bash lab/oracle-sidecar/inspect-read-only.sh)"
          echo "$report" | grep -qx 'production_wireguard_modified=false'
          echo "$report" | grep -qx 'route_dns_firewall_modified=false'
          echo "$report" | grep -qx 'keys_or_endpoints_collected=false'
          echo "$report" | grep -qx 'safe_to_enable_oracle_sidecar=false'
          echo 'R9_CI_PASS: sanitized inspection succeeds on generic Linux runner; NOT Oracle server readiness or external-host evidence'
