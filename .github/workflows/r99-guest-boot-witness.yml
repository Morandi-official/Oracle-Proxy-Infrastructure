name: R99 independently witness real Windows NT boot in isolated free QEMU guest

on:
  pull_request:
    paths:
      - 'lab/cloud-windows-r99/**'
      - 'docs/r99-offline-windows-boot-evidence.md'
      - '.github/workflows/r99-guest-boot-witness.yml'

permissions:
  contents: read

concurrency:
  group: r99-guest-witness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pure-denial-matrix:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows boot EVTX witness forged and stale record negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s lab/cloud-windows-r99 -p 'test_windows_boot_evtx_witness.py' -v
          # Catch accidental deletion of the genuine QEMU host-control
          # functions before any costly official VHD download.
          bash -n lab/cloud-windows-r99/run_guest_boot_witness.sh
          for fn in 'check_kvm_before_guest' 'launch' 'stop'; do
            grep -Fqx "$fn() {" lab/cloud-windows-r99/run_guest_boot_witness.sh || {
              echo "R99_MISSING_HOST_CONTROL_FUNCTION=$fn"
              exit 6
            }
          done
          grep -Fq -- '-nic none' lab/cloud-windows-r99/run_guest_boot_witness.sh
          echo 'R99_QEMU_CONTROL_AND_NO_GUEST_NIC_STATIC_PRECHECK_PASS'
          echo 'R99_BOOT_WITNESS_NEGATIVE_MATRIX_PASS'
          echo 'R99_WINDOWS_GUEST_RUNNING_IN_THIS_TEST=false'
  host-loop-ntfs-smoke:
    needs: pure-denial-matrix
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify safe read-only NTFS loop from synthetic disk and exact teardown
        shell: bash
        run: bash lab/cloud-windows-r99/test_host_loop_ntfs.sh
  evtx-runtime-dependency-smoke:
    needs: pure-denial-matrix
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Signed Ubuntu EVTX parser runtime dependency and source inspection
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update -qq
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends python3-evtx >/dev/null
          version=$(dpkg-query -W -f='${Version}' python3-evtx)
          [[ "$version" == 0.7.4-* ]] || {
            echo R99_REFUSED_UNREVIEWED_EVTX_PARSER_VERSION; exit 6;
          }
          /usr/bin/python3 -B -c 'from Evtx.Evtx import Evtx; print("R99_EVTX_PARSER_DEPENDENCIES_COMPLETE_PASS")'
          /usr/bin/python3 -B -m unittest discover -s lab/cloud-windows-r99 -p 'test_windows_boot_evtx_witness.py' -v
          echo 'R99_SYSTEM_PARSER_IMPORT_BEFORE_VHD_DOWNLOAD_PASS'
  synthetic-efi-inventory-smoke:
    needs: pure-denial-matrix
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate EFI FAT partition inventory and zero-owned-loop residual
        shell: bash
        run: bash lab/cloud-windows-r99/test_synthetic_efi_paths.sh
  isolated-real-windows-boot-evidence:
    needs: [pure-denial-matrix, host-loop-ntfs-smoke, evtx-runtime-dependency-smoke, synthetic-efi-inventory-smoke]
    # Synthetic Linux RO NTFS loop mounting must pass before any official VHD is downloaded.
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r99-cloud-windows-serial-boot-witness-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Only standard free hosted runner, no persistent Windows image or artifact
        shell: bash
        run: |
          set -euo pipefail
          echo 'R99_NO_PAID_RUNNER_NO_NEW_CLOUD_OR_PRODUCT_KEY'
          echo 'R99_NO_GUEST_NIC_VPN_DRIVER_WFP_OR_ORACLE'
          echo 'R99_NO_ARTIFACT_CACHE_OR_PERSISTENT_VM_DISK'
      - name: Boot official evaluation guest and verify offline Microsoft kernel/eventlog boot records
        shell: bash
        timeout-minutes: 37
        run: bash lab/cloud-windows-r99/run_guest_boot_witness.sh
