name: Tailscale production client release

on:
  push:
    branches: [main]
    paths: [ops/tailscale/release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-production-client-release
  cancel-in-progress: false

jobs:
  ready:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      android_run: ${{ steps.release.outputs.android_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        name: Read the requested release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested=$(jq -er '.version | strings | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' ops/tailscale/release.json)
          android_run=$(jq -er '.accepted_android_run // "" | tostring | select(test("^([1-9][0-9]*|)$"))' ops/tailscale/release.json)
          if [[ -n "$android_run" ]]; then
            run_api="repos/$GITHUB_REPOSITORY/actions/runs/$android_run"
            tested=$(gh api "$run_api" | jq -er 'select(.name == "Tailscale production client release" and .head_branch == "main" and .status == "completed" and .event == "push") | .head_sha')
            gh api "$run_api/jobs?per_page=100" | jq -e '
              [.jobs[] | select(.conclusion == "success") | .name] | contains(["android-package", "android-acceptance"])' >/dev/null
            git fetch --no-tags --depth=1 origin "$tested"
            git diff --exit-code "$tested" "$GITHUB_SHA" -- clients/android/tailscale clients/android/tailscale-app
            test "$(awk '/^[[:space:]]*versionName / {gsub(/\047/,"",$2); print $2}' clients/android/tailscale-app/build.gradle)" = "$requested"
          fi
          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
      - name: Wait for the Oracle account gateway and Headscale coordinator
        run: |
          host=https://vpn-admin.morandi.dpdns.org
          for attempt in {1..36}; do
            if curl -fsS --max-time 8 "$host/api/tailscale/v1/ready" | jq -e '.ready == true' >/dev/null &&
               curl -fsS --max-time 8 "$host/key?v=148" | jq -e '.publicKey | startswith("mkey:")' >/dev/null; then
              echo 'ORACLE_TAILSCALE_READY=PASS'
              exit 0
            fi
            sleep 20
          done
          echo 'Oracle Tailscale gateway or coordination endpoint unavailable' >&2
          exit 1

  windows-package:
    needs: ready
    uses: ./.github/workflows/tailscale-windows.yml
    with:
      version: ${{ needs.ready.outputs.version }}

  windows-acceptance:
    needs: [ready, windows-package]
    runs-on: windows-2025
    timeout-minutes: 12
    environment: windows-client-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-windows-bundle
          path: dist/tailscale-windows
      - name: Measure the installed client's real Oracle route and recovery
        env:
          VERSION: ${{ needs.ready.outputs.version }}
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: ./ops/tailscale/windows/accept.ps1 -Version $env:VERSION -BundleDirectory ./dist/tailscale-windows -Live
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-windows-client
          path: dist/tailscale-windows/
          if-no-files-found: error
          retention-days: 7

  android-package:
    needs: ready
    if: needs.ready.outputs.android_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    environment: android-release
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check signing bindings before building the native engine
        env:
          HAS_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 != '' && secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD != '' && secrets.ANDROID_SIGNING_KEY_ALIAS != '' && secrets.ANDROID_SIGNING_KEY_PASSWORD != '' }}
        run: test "$HAS_SIGNING_KEY" = true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale-android
          ref: 62d1e58c2ecaf52914476ecb97239fbbf70298ea
          path: upstream/tailscale-android
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/tailscale-android/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build pinned Android engine and bundle its notices
        working-directory: upstream/tailscale-android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          make build-unstripped-aar
          notices="$RUNNER_TEMP/proxy-notices/licenses"
          mkdir -p "$notices"
          core=$(go list -m -f '{{.Dir}}' tailscale.com)
          test -n "$core"
          cp LICENSE "$notices/tailscale-android.txt"
          cp "$core/LICENSE" "$notices/tailscale.txt"
          cp "$core/licenses/android.md" "$notices/android.md"
          cp "$core/licenses/tailscale.md" "$notices/tailscale.md"
      - name: Build the owner-signed application and matching instrumentation
        id: package
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: bash clients/android/tailscale-app/ci/sign-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-android-signed
          path: ${{ runner.temp }}/tailscale-android-signed/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-android-test
          path: clients/android/tailscale-app/build/outputs/apk/androidTest/release/*-release-androidTest.apk
          if-no-files-found: error
          retention-days: 1

  android-acceptance:
    needs: android-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: windows-client-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-android-signed
          path: application
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-android-test
          path: instrumentation
      - name: Accept the signed application through the Oracle exit
        env:
          ANDROID_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ANDROID_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: |
          set -euo pipefail
          (cd application && sha256sum --check SHA256SUMS.txt)
          shopt -s nullglob
          tests=(instrumentation/*.apk)
          test "${#tests[@]}" -eq 1
          bash clients/android/tailscale-app/ci/production-test.sh \
            application/Proxy-Android.apk "${tests[0]}" "$RUNNER_TEMP/android-performance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-android-performance
          path: ${{ runner.temp }}/android-performance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [ready, windows-acceptance, android-package, android-acceptance]
    if: >-
      ${{
        !cancelled() && needs.ready.result == 'success' && needs.windows-acceptance.result == 'success' &&
        (needs.ready.outputs.android_run != '' ||
         (needs.android-package.result == 'success' && needs.android-acceptance.result == 'success'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-windows-client
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-android-signed
          path: android
          github-token: ${{ github.token }}
          run-id: ${{ needs.ready.outputs.android_run || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-android-performance
          path: android-metrics
          github-token: ${{ github.token }}
          run-id: ${{ needs.ready.outputs.android_run || github.run_id }}
      - name: Publish the accepted Windows and Android clients together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.ready.outputs.version }}
          ANDROID_VERSION: ${{ needs.android-package.outputs.version || (needs.ready.outputs.android_run != '' && needs.ready.outputs.version) }}
        run: |
          set -euo pipefail
          test "$VERSION" = "$ANDROID_VERSION"
          jq -e '.accepted == true' windows/ACCEPTANCE.json >/dev/null
          jq -e '.continuous_egress_probes == 10 and
                 (.reconnect_to_verified_ms | length == 3) and
                 (.disconnect_to_direct_ms | length == 4) and
                 .baseline.down_mbps_median > 0 and .baseline.up_mbps_median > 0 and
                 .vpn.down_mbps_median > 0 and .vpn.up_mbps_median > 0' \
            android-metrics/android-performance.json >/dev/null
          test -s "windows/Proxy-$VERSION-win-x64.zip"
          test -s "windows/Proxy-$VERSION-win-x64-setup.exe"
          test -s android/Proxy-Android.apk
          (cd windows && sha256sum --strict -c SHA256SUMS.txt)
          (cd android && sha256sum --strict -c SHA256SUMS.txt)
          cp windows/SHA256SUMS.txt SHA256SUMS-Windows.txt
          cp android/SHA256SUMS.txt SHA256SUMS-Android.txt
          tag="tailscale-v$VERSION"
          target=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
          if [[ -z "$target" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          gh api "repos/$GH_REPO/git/ref/tags/$tag" |
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/tailscale-release.json" 2>/dev/null; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/tailscale-release.json" >/dev/null; then
              jq -e --arg portable "Proxy-$VERSION-win-x64.zip" --arg setup "Proxy-$VERSION-win-x64-setup.exe" \
                '[.assets[].name] | contains([$portable, $setup, "Proxy-Android.apk", "SHA256SUMS-Windows.txt", "SHA256SUMS-Android.txt"])' \
                "$RUNNER_TEMP/tailscale-release.json" >/dev/null
              exit 0
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "Proxy Tailscale $VERSION" \
              --notes "Windows (x64) installer and portable package, and signed Android APK. Both clients passed production exit and performance acceptance in workflow $GITHUB_RUN_ID."
          fi
          gh release upload "$tag" --clobber \
            "windows/Proxy-$VERSION-win-x64.zip" "windows/Proxy-$VERSION-win-x64-setup.exe" \
            android/Proxy-Android.apk SHA256SUMS-Windows.txt SHA256SUMS-Android.txt
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url,assets --jq '.url, (.assets[].url)'
