name: Tailscale migration data-path lab

on:
  pull_request:
    paths:
      - .github/workflows/tailscale-migration-lab.yml
      - ops/tailscale/lab/**
      - server/admin-oracle/control/tailscale_control.py
      - server/admin-oracle/control/tailscale_egress.py
      - server/admin-oracle/control/tailscale_registry.py
      - clients/windows/tailscale/**
      - clients/android/tailscale/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned upstream packages
        run: bash ops/tailscale/lab/fetch-tools.sh "$RUNNER_TEMP/proxy-tailscale-tools"
      - name: Verify device admission and isolated IPv4, IPv6 and DNS exit
        run: sudo bash ops/tailscale/lab/check-exit.sh "$RUNNER_TEMP/proxy-tailscale-tools"
  windows-local-control:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Probe the Windows Tailscale engine on a separate protected pipe
        run: ./ops/tailscale/lab/check-windows.ps1
  android-native-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Android engine source
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale-android
          ref: 62d1e58c2ecaf52914476ecb97239fbbf70298ea
          path: upstream/tailscale-android
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/tailscale-android/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the Tailscale Android bridge for emulator and phone
        working-directory: upstream/tailscale-android
        run: |
          make build-unstripped-aar
          archive=android/libs/libtailscale_unstripped.aar
          unzip -l "$archive" | awk '/jni\/arm64-v8a\/libgojni.so$/{phone=1} /jni\/x86_64\/libgojni.so$/{emulator=1} END{exit !(phone && emulator)}'
          unzip -p "$archive" classes.jar > "$RUNNER_TEMP/tailscale-native-bridge.jar"
          jar tf "$RUNNER_TEMP/tailscale-native-bridge.jar" | awk '/libtailscale\/IPNService.class$/{service=1} /libtailscale\/Application.class$/{app=1} END{exit !(service && app)}'
          echo 'TAILSCALE_ANDROID_NATIVE_BRIDGE_BUILD=PASS'
      - name: Compile the Android client binding against the built bridge
        run: |
          platform=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -n 1)
          test -n "$platform"
          javac --release 17 -cp "$RUNNER_TEMP/tailscale-native-bridge.jar:$platform" \
            -d "$RUNNER_TEMP/tailscale-client-classes" clients/android/tailscale/*.java
          echo 'TAILSCALE_ANDROID_LOCAL_API_BINDING_COMPILED=PASS'
      - name: Build a disposable Android application using only the new runtime
        run: >-
          gradle --no-daemon
          -p ops/tailscale/lab/android-app
          -PtailscaleBridge="$GITHUB_WORKSPACE/upstream/tailscale-android/android/libs/libtailscale_unstripped.aar"
          assembleDebug
      - name: Launch the native runtime in a real Android emulator
        run: |
          shopt -s nullglob
          apks=(ops/tailscale/lab/android-app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" = 1
          bash ops/tailscale/lab/check-android.sh "${apks[0]}"
