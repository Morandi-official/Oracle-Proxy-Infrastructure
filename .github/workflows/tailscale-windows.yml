name: Tailscale Windows packages and Oracle acceptance

on:
  push:
    branches: [main]
    paths:
      - ops/tailscale/windows-acceptance.json
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      live_acceptance:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Windows client SemVer
        default: '0.1.1'
        required: true
        type: string
      live_acceptance:
        description: Verify the installed client against the live Oracle exit
        default: false
        type: boolean

permissions:
  contents: read

env:
  TOP_LEVEL_PUSH: ${{ github.event_name == 'push' && github.workflow == 'Tailscale Windows packages and Oracle acceptance' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      version: ${{ steps.request.outputs.version }}
      experiment: ${{ steps.request.outputs.experiment }}
      system_dns_fault: ${{ steps.request.outputs.system_dns_fault }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Read the requested version
        id: request
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          $experiment = ''
          $dnsFault = $false
          if ($env:TOP_LEVEL_PUSH -eq 'true') {
            $request = Get-Content -LiteralPath ./ops/tailscale/windows-acceptance.json -Raw | ConvertFrom-Json
            $version = $request.version
            if ($request.PSObject.Properties['system_dns_fault']) {
              if ($request.system_dns_fault -isnot [bool]) { throw 'WINDOWS_DNS_FAULT_INVALID' }
              $dnsFault = $request.system_dns_fault
            }
            if ($request.PSObject.Properties['experiment']) {
              if ($request.experiment -cne 'retained-coordinator') { throw 'WINDOWS_EXPERIMENT_INVALID' }
              $experiment = $request.experiment
            }
          }
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'WINDOWS_VERSION_INVALID' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($dnsFault -and $experiment) { throw 'WINDOWS_DNS_FAULT_REQUIRES_PRODUCT_ACCEPTANCE' }
          "experiment=$experiment" >> $env:GITHUB_OUTPUT
          "system_dns_fault=$($dnsFault.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build the Windows x64 portable and setup distributions
        env:
          VERSION: ${{ steps.request.outputs.version }}
          EXPERIMENT: ${{ steps.request.outputs.experiment }}
        run: |
          $retain = $env:EXPERIMENT -ceq 'retained-coordinator'
          ./ops/tailscale/windows/build.ps1 -Version $env:VERSION -OutputDirectory ./dist/tailscale-windows -RetentionExperiment:$retain
      - name: Verify the setup installs the exact portable payload
        if: '!inputs.live_acceptance && env.TOP_LEVEL_PUSH != ''true'''
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: ./ops/tailscale/windows/accept.ps1 -Version $env:VERSION -BundleDirectory ./dist/tailscale-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.experiment == 'retained-coordinator' && 'tailscale-windows-retained-coordinator-bundle' || 'tailscale-windows-bundle' }}
          path: dist/tailscale-windows/
          if-no-files-found: error
          retention-days: 3

  live:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.live_acceptance ||
      (github.event_name == 'push' && github.workflow == 'Tailscale Windows packages and Oracle acceptance'))
    needs: build
    runs-on: windows-2025
    timeout-minutes: 12
    environment: windows-client-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.experiment == 'retained-coordinator' && 'tailscale-windows-retained-coordinator-bundle' || 'tailscale-windows-bundle' }}
          path: dist/tailscale-windows
      - name: Measure the installed client's real Oracle route and recovery
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPERIMENT: ${{ needs.build.outputs.experiment }}
          SYSTEM_DNS_FAULT: ${{ needs.build.outputs.system_dns_fault }}
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: |
          $retain = $env:EXPERIMENT -ceq 'retained-coordinator'
          $blocked = $env:SYSTEM_DNS_FAULT -ceq 'true'
          ./ops/tailscale/windows/accept.ps1 -Version $env:VERSION -BundleDirectory ./dist/tailscale-windows -Live -RetentionExperiment:$retain -BlockSystemDns:$blocked
      - uses: actions/upload-artifact@v4
        if: needs.build.outputs.experiment != 'retained-coordinator'
        with:
          name: tailscale-windows-client
          path: dist/tailscale-windows/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && needs.build.outputs.experiment == 'retained-coordinator' && hashFiles('dist/tailscale-windows/RETAINED_COORDINATOR.json') != ''
        with:
          name: tailscale-windows-retained-coordinator-report
          path: dist/tailscale-windows/RETAINED_COORDINATOR.json
          if-no-files-found: error
          retention-days: 7
