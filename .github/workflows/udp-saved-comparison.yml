name: Compare saved UDP observations
on:
  push:
    branches: [main]
    paths: [.github/workflows/udp-saved-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: oracle-ops
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read existing transport observations
        env:
          ADMIN_LOCAL_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_ADMIN_LOCAL_USERNAME }}
          ADMIN_LOCAL_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_ADMIN_LOCAL_PASSWORD }}
        run: python3 ops/flclash-diagnosis/saved_udp_comparison.py
