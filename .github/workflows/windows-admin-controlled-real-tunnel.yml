name: G11 native GUI admin IPC controls disposable WireGuard SCM services

on:
  pull_request:
    paths:
      - '.github/workflows/windows-admin-controlled-real-tunnel.yml'
      - 'clients/windows/service-host/**'
      - 'clients/windows/manager/**'
      - 'clients/windows/app/**'
      - 'clients/windows/lab/build-scm-components.ps1'
      - 'clients/windows/lab/stage-scm-lab.ps1'
      - 'clients/windows/lab/generate_service_pair.py'
      - 'clients/windows/lab/run-admin-controlled-scm.ps1'
      - 'lab/wfp-scoped/Test-R15-GuardedScmTunnel.ps1'
      - 'lab/wfp-scoped/Test-R18-MultiProtocolGuard.ps1'
      - 'lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1'
      - 'lab/wfp-scoped/Test-R22-GuardTamper.ps1'
      - 'lab/wfp-scoped/Test-R24-AddressScopeTamper.ps1'
      - 'lab/wfp-scoped/Test-R26-InterfaceScopeTamper.ps1'
      - 'clients/windows/lab/cleanup-scm-lab.ps1'
      - 'clients/windows/lab/wgnt-service-observe.c'
      - 'clients/windows/lab/wgnt-r34-nonce-proof.c'
      - 'clients/windows/service-host/CiSealedConfig.cs'

permissions:
  contents: read

concurrency:
  group: official-tunnel-admin-ipc-disposable-lab
  cancel-in-progress: true

jobs:
  scm-controlled-by-gui:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feat/windows-admin-lab-control-pipe' || github.event.pull_request.head.ref == 'feat/windows-release-separation-gate' || github.event.pull_request.head.ref == 'test/r15-wfp-wireguard-scm-transaction' || github.event.pull_request.head.ref == 'feat/r16-native-driver-authenticode-runtime-gate' || github.event.pull_request.head.ref == 'test/r18-wfp-tcp-udp-dns-tunnel-coexist' || github.event.pull_request.head.ref == 'test/r19-manager-crash-wfp-persistence' || github.event.pull_request.head.ref == 'feat/r21-system-owned-wfp-ci-guard' || github.event.pull_request.head.ref == 'test/r22-ci-manager-wfp-tamper-response' || github.event.pull_request.head.ref == 'feat/r23-hardpin-official-wireguard-nt-runtime' || github.event.pull_request.head.ref == 'test/r24-wfp-scope-narrowing-denial' || github.event.pull_request.head.ref == 'feat/r25-clean-system-wfp-adoption' || github.event.pull_request.head.ref == 'feat/r26-ci-wfp-interface-scope-lock' || github.event.pull_request.head.ref == 'feat/r30-ci-system-dpapi-native-tunnel' || github.event.pull_request.head.ref == 'feature/r38-ci-system-dpapi-nonce-integration')
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ORACLE_R30_DPAPI_TEST: ${{ (github.event.pull_request.head.ref == 'feat/r30-ci-system-dpapi-native-tunnel' || github.event.pull_request.head.ref == 'feature/r38-ci-system-dpapi-nonce-integration') && 'CI_ONLY' || 'DISABLED' }}
      ORACLE_R34_NONCE_PROBE: ${{ (github.event.pull_request.head.ref == 'feature/r34-ci-cryptographic-nonce-echo' || github.event.pull_request.head.ref == 'feature/r38-ci-system-dpapi-nonce-integration') && 'CI_ONLY' || 'DISABLED' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WireGuard/wireguard-windows
          ref: 6ece77bc487c8aa697e3c092197621c4f3e5ccb8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preflight disposable VM and preserve IPv4/IPv6 default routes
        shell: pwsh
        run: ./clients/windows/lab/preflight.ps1
      - name: Verify signed official WireGuardNT and pinned source toolchain
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Compile genuine upstream tunnel.dll plus independent service host
        shell: pwsh
        run: ./clients/windows/lab/build-scm-components.ps1
      - name: Generate two ephemeral test X25519 keypairs
        shell: pwsh
        run: ./clients/windows/lab/generate-keys.ps1
      - name: Stage narrow-route lab configurations and NTFS protected DLLs
        shell: pwsh
        run: ./clients/windows/lab/stage-scm-lab.ps1
      - name: R15 negative CI boundary test (cannot install WFP outside disposable runner)
        if: github.event.pull_request.head.ref == 'test/r15-wfp-wireguard-scm-transaction'
        shell: pwsh
        run: |
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $refused = $false
          try { ./lab/wfp-scoped/Test-R15-GuardedScmTunnel.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'R15 unauthorized WFP rule request succeeded' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object Name -like 'OracleProxy-R15-CI-*').Count -ne 0) {
            throw 'R15 denial left a firewall rule'
          }
      - name: R15 real GUI/SCM WireGuard peers + persistent narrow WFP rule
        if: github.event.pull_request.head.ref == 'test/r15-wfp-wireguard-scm-transaction'
        shell: pwsh
        timeout-minutes: 8
        run: ./lab/wfp-scoped/Test-R15-GuardedScmTunnel.ps1
      - name: R15 ALWAYS check no synthetic WFP rules remain
        if: always() && github.event.pull_request.head.ref == 'test/r15-wfp-wireguard-scm-transaction'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object Name -like 'OracleProxy-R15-CI-*').Count -ne 0) {
            throw 'R15 WFP rule escaped exact cleanup'
          }
      - name: 'R18 negative: refuse non-disposable WFP operation'
        if: github.event.pull_request.head.ref == 'test/r18-wfp-tcp-udp-dns-tunnel-coexist'
        shell: pwsh
        run: |
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $refused = $false
          try { ./lab/wfp-scoped/Test-R18-MultiProtocolGuard.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'R18 allowed unauthorized WFP installation' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object Name -like 'OracleProxy-R18-CI-*').Count -ne 0) {
            throw 'R18 denial created a filter'
          }
      - name: R18 genuine WG traffic with process-wide WFP TCP and UDP DNS denial
        if: github.event.pull_request.head.ref == 'test/r18-wfp-tcp-udp-dns-tunnel-coexist'
        shell: pwsh
        timeout-minutes: 9
        run: ./lab/wfp-scoped/Test-R18-MultiProtocolGuard.ps1
      - name: R18 ALWAYS check no broad WFP policy remains
        if: always() && github.event.pull_request.head.ref == 'test/r18-wfp-tcp-udp-dns-tunnel-coexist'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object Name -like 'OracleProxy-R18-CI-*').Count -ne 0) {
            throw 'R18 firewall guard escaped cleanup'
          }
      - name: R19 owned SYSTEM manager crash with live persistent WFP and WireGuard
        if: github.event.pull_request.head.ref == 'test/r19-manager-crash-wfp-persistence'
        shell: pwsh
        timeout-minutes: 9
        env:
          ORACLE_R19_CRASH_TEST: CI_OWNED_MANAGER_ONLY
        run: ./lab/wfp-scoped/Test-R18-MultiProtocolGuard.ps1
      - name: R19 ALWAYS check no WFP policy from the owned manager crash remains
        if: always() && github.event.pull_request.head.ref == 'test/r19-manager-crash-wfp-persistence'
        shell: pwsh
        run: |
          $remaining = @(Get-NetFirewallRule -ErrorAction Stop | Where-Object Name -like 'OracleProxy-R18-CI-*')
          if ($remaining.Count -ne 0) { throw 'R19 left persistent process-scoped WFP filter on ephemeral runner' }
          Write-Host 'R19_CRASH_RECOVERY_POLICY_CLEAN_PASS'
      - name: R21 negative refuse non CI policy installation
        if: github.event.pull_request.head.ref == 'feat/r21-system-owned-wfp-ci-guard'
        shell: pwsh
        run: |
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $refused = $false
          try { ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'R21 system guard test accepted non CI environment' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          if (Get-NetFirewallRule -Name OracleProxy-R21-CI-SYSTEM-OnlyGuard -ErrorAction SilentlyContinue) {
            throw 'R21 unauthorized guard created'
          }
      - name: R21 actual LocalSystem installs WFP rule and rule survives hard manager crash
        if: github.event.pull_request.head.ref == 'feat/r21-system-owned-wfp-ci-guard'
        shell: pwsh
        timeout-minutes: 9
        run: ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1
      - name: R21 ALWAYS assert fixed SYSTEM guard absent after job
        if: always() && github.event.pull_request.head.ref == 'feat/r21-system-owned-wfp-ci-guard'
        shell: pwsh
        run: |
          $left = @(Get-NetFirewallRule -ErrorAction Stop |
            Where-Object DisplayName -eq 'OracleProxy-R21-CI-SYSTEM-OnlyGuard')
          if ($left.Count -ne 0) {
            throw 'R21 persistent SYSTEM filter escaped explicit cleanup'
          }
      - name: R22 negative guard self-test refuses non-CI invocation
        if: github.event.pull_request.head.ref == 'test/r22-ci-manager-wfp-tamper-response'
        shell: pwsh
        run: |
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $denied = $false
          try { ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1 } catch { $denied = $true }
          if (-not $denied) { throw 'R22 unsafe runner gate bypass' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
      - name: R22 real SYSTEM service halts live WG on WFP tamper and refuses reconnect
        if: github.event.pull_request.head.ref == 'test/r22-ci-manager-wfp-tamper-response'
        shell: pwsh
        timeout-minutes: 10
        env:
          ORACLE_R22_TAMPER_TEST: CI_ONLY
        run: ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1
      - name: R22 ALWAYS enforce zero remaining test WFP rules
        if: always() && github.event.pull_request.head.ref == 'test/r22-ci-manager-wfp-tamper-response'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object DisplayName -eq 'OracleProxy-R21-CI-SYSTEM-OnlyGuard').Count -ne 0) {
            throw 'R22 owned CI WFP rule survived expected exact cleanup'
          }
      - name: R24 manager rejects narrowed remote-address WFP scope and latches compromise
        if: github.event.pull_request.head.ref == 'test/r24-wfp-scope-narrowing-denial'
        shell: pwsh
        timeout-minutes: 10
        env:
          ORACLE_R24_NARROW_TAMPER: CI_ONLY
        run: ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1
      - name: R24 ALWAYS require exact scoped CI firewall rule cleanup
        if: always() && github.event.pull_request.head.ref == 'test/r24-wfp-scope-narrowing-denial'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object DisplayName -eq 'OracleProxy-R21-CI-SYSTEM-OnlyGuard').Count -gt 0) {
            throw 'R24 rule escaped cleanup'
          }
      - name: R26 SYSTEM rejects narrowed WFP interface scope and latches denied reconnect
        if: github.event.pull_request.head.ref == 'feat/r26-ci-wfp-interface-scope-lock'
        shell: pwsh
        timeout-minutes: 10
        env:
          ORACLE_R26_INTERFACE_TAMPER: CI_ONLY
        run: ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1
      - name: R26 ALWAYS verify exact CI WFP test rule was removed
        if: always() && github.event.pull_request.head.ref == 'feat/r26-ci-wfp-interface-scope-lock'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object DisplayName -eq 'OracleProxy-R21-CI-SYSTEM-OnlyGuard').Count -ne 0) {
            throw 'R26 CI-only WFP filter remains after cleanup'
          }
      - name: R25 native SYSTEM manager restarts after crash by strictly adopting original WFP
        if: github.event.pull_request.head.ref == 'feat/r25-clean-system-wfp-adoption'
        shell: pwsh
        timeout-minutes: 10
        env:
          ORACLE_R25_RESTART_TEST: CI_ONLY
        run: ./lab/wfp-scoped/Test-R21-SystemOwnedGuard.ps1
      - name: R25 ALWAYS verify OS-persistent CI WFP guard explicitly released
        if: always() && github.event.pull_request.head.ref == 'feat/r25-clean-system-wfp-adoption'
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop |
              Where-Object DisplayName -eq 'OracleProxy-R21-CI-SYSTEM-OnlyGuard').Count -gt 0) {
            throw 'R25 SYSTEM guard was not explicitly removed'
          }
      - name: Verified Windows GUI admin IPC controls two real SCM tunnel services
        if: github.event.pull_request.head.ref != 'test/r15-wfp-wireguard-scm-transaction' && github.event.pull_request.head.ref != 'test/r18-wfp-tcp-udp-dns-tunnel-coexist' && github.event.pull_request.head.ref != 'test/r19-manager-crash-wfp-persistence' && github.event.pull_request.head.ref != 'feat/r21-system-owned-wfp-ci-guard' && github.event.pull_request.head.ref != 'test/r22-ci-manager-wfp-tamper-response' && github.event.pull_request.head.ref != 'test/r24-wfp-scope-narrowing-denial' && github.event.pull_request.head.ref != 'feat/r25-clean-system-wfp-adoption' && github.event.pull_request.head.ref != 'feat/r26-ci-wfp-interface-scope-lock'
        shell: pwsh
        timeout-minutes: 4
        run: ./clients/windows/lab/run-admin-controlled-scm.ps1
      - name: ALWAYS remove only disposable SCM services, native DLLs and secrets
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup-scm-lab.ps1
      - name: ALWAYS verify IPv4/IPv6 default routes were not changed
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup.ps1
