name: Windows native preview build

on:
  pull_request:
    paths:
      - 'clients/windows/app/**'
      - 'clients/windows/diagnostics/**'
      - '.github/workflows/windows-client-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-win-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone Windows desktop executable
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output ./dist/windows-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify native policy test entrypoint
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          Write-Host "Native policy self-test exit code: $($test.ExitCode)"
          if ($test.ExitCode -ne 0) { throw 'Native policy self-test failed' }
          Write-Host 'PASS: native policy self-tests on Windows host'
      - name: R54 run pure Windows native diagnostics without PowerShell under Restricted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $env:PSExecutionPolicyPreference='Restricted'
          $test = Start-Process -FilePath $exe -ArgumentList '--diagnostics-self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'R54 Windows IP Helper/SCM diagnostics failed' }
          $payload = @(Get-ChildItem './dist/windows-win-x64' -File -Recurse)
          $forbidden = @('wireguard.dll','tunnel.dll','OracleProxy.WireGuardHost.exe',
              'OracleProxy.LabManager.exe')
          if (@($payload | Where-Object {
              $_.Extension -in @('.ps1','.psm1','.bat','.cmd') -or
              $_.Name -in $forbidden
            }).Count -ne 0) {
            throw 'R54 GUI unexpectedly shipped a script or VPN control driver'
          }
          Write-Host 'R54_WIN32_NATIVE_READONLY_UNDER_RESTRICTED_POLICY_PASS'
      - name: Verify W3 control-state transition matrix
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--control-self-test' -Wait -PassThru
          Write-Host "Native control-state simulation exit code: $($test.ExitCode)"
          if ($test.ExitCode -ne 0) { throw 'W3 control-state self-test failed' }
          Write-Host 'PASS: offline control-state crash, authorization and VPN intent matrix'
      - name: Verify strict offline control protocol
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--protocol-self-test' -Wait -PassThru
          Write-Host "Native protocol self-test exit code: $($test.ExitCode)"
          if ($test.ExitCode -ne 0) { throw 'W4 mock protocol test failed' }
          Write-Host 'PASS: untrusted, oversized, malformed, replayed and unauthorized mock requests denied'
      - name: R108 verify evidence-honest acceptance report and reject private data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--acceptance-report-self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'R108 sanitized acceptance report offline safety test failed' }
          Write-Host 'R108_REPORT_NOT_TESTED_STAYS_NOT_TESTED_AND_PRIVATE_FIELDS_REJECTED_PASS'
          Write-Host 'R108_NO_REAL_WFP_VPN_INTERNET_TESTS_OR_PRODUCT_RELEASE'
      - name: Verify integrated sanitized diagnostics entrypoint
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/windows-win-x64/OracleProxy.Windows.Preview.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--diagnostics-self-test' -Wait -PassThru
          Write-Host "Native diagnostic self-test exit code: $($test.ExitCode)"
          if ($test.ExitCode -ne 0) { throw 'Native diagnostic integration self-test failed' }
          Write-Host 'PASS: native app launches sanitized diagnostic collector'
      - name: Upload unsigned test-only preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oracle-proxy-windows-v0.2-managed-readonly-test-win-x64
          path: ./dist/windows-win-x64/**
          if-no-files-found: error
          retention-days: 7
