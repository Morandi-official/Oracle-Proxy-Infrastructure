name: Windows native preview build

on:
  pull_request:
    paths:
      - 'clients/windows/app/**'
      - 'clients/windows/diagnostics/**'
      - '.github/workflows/windows-client-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-win-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone Windows desktop executable
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None --output ./dist/windows-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify native policy test entrypoint
        shell: pwsh
        run: |
          & ./dist/windows-win-x64/OracleProxy.Windows.Preview.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native policy self-test failed' }
          Write-Host 'PASS: native policy self-tests on Windows host'
      - name: Verify integrated sanitized diagnostics entrypoint
        shell: pwsh
        run: |
          & ./dist/windows-win-x64/OracleProxy.Windows.Preview.exe --diagnostics-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native diagnostic integration self-test failed' }
          Write-Host 'PASS: native app launches sanitized diagnostic collector'
      - name: Upload unsigned test-only preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: oracle-proxy-windows-preview-win-x64
          path: ./dist/windows-win-x64/**
          if-no-files-found: error
          retention-days: 7
