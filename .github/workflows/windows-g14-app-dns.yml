name: G14 Windows WireGuardNT app UDP and synthetic DNS delivery

on:
  pull_request:
    paths:
      - '.github/workflows/windows-g14-app-dns.yml'
      - 'clients/windows/service-host/**'
      - 'clients/windows/manager/**'
      - 'clients/windows/app/**'
      - 'clients/windows/lab/build-scm-components.ps1'
      - 'clients/windows/lab/stage-scm-lab.ps1'
      - 'clients/windows/lab/generate_service_pair.py'
      - 'clients/windows/lab/run-admin-controlled-scm.ps1'
      - 'clients/windows/lab/cleanup-scm-lab.ps1'
      - 'clients/windows/lab/wgnt-service-observe.c'
      - 'clients/windows/lab/wgnt-data-plane.c'
      - 'clients/windows/lab/wgnt-app-dns.c'
      - 'clients/windows/lab/Invoke-R73CiOwnedExpiryRecovery.ps1'
      - 'clients/windows/lab/Invoke-R73ManagerCrashAndRecover.ps1'
      - 'clients/windows/lab/Invoke-R74CiTimedExpiryWatch.ps1'
      - 'clients/windows/lab/Invoke-R74CiCrashAndTimedRecovery.ps1'
      - 'clients/windows/lab/Test-R70NativeLiveRouteScope.ps1'
      - 'lab/independent-peer/r69_native_scope.py'
      - 'clients/windows/lab/test_r69_native_scope.py'

permissions:
  contents: read

concurrency:
  group: official-tunnel-g14-application-disposable-lab
  cancel-in-progress: true

jobs:
  scm-controlled-by-gui:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'integration/windows-safe-alpha' || github.event.pull_request.head.ref == 'test/r65-g14-authenticated-scm-wgnt-20261017' || github.event.pull_request.head.ref == 'test/r69-native-narrow-route-audit-20261017' || github.event.pull_request.head.ref == 'test/r70-live-native-route-dns-20261017' || github.event.pull_request.head.ref == 'test/r73-ci-native-manager-crash-recovery-20261017' || github.event.pull_request.head.ref == 'test/r74-ci-native-timed-expiry-20261017')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: WireGuard/wireguard-windows
          ref: 6ece77bc487c8aa697e3c092197621c4f3e5ccb8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight disposable VM and preserve IPv4/IPv6 default routes
        shell: pwsh
        run: ./clients/windows/lab/preflight.ps1
      - name: Verify signed official WireGuardNT and pinned source toolchain
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Compile genuine upstream tunnel.dll plus independent service host
        shell: pwsh
        run: ./clients/windows/lab/build-scm-components.ps1
      - name: Generate two ephemeral test X25519 keypairs
        shell: pwsh
        run: ./clients/windows/lab/generate-keys.ps1
      - name: Stage narrow-route lab configurations and NTFS protected DLLs
        shell: pwsh
        run: ./clients/windows/lab/stage-scm-lab.ps1
      - name: R69 independent deny-by-default audit of actual native lab configs before SCM services
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s clients/windows/lab -p 'test_r69_native_scope.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'R69 negative profile audit regression' }
          $env:RUNNER_ENVIRONMENT='forbidden'
          python ./lab/independent-peer/r69_native_scope.py --audit-staged
          if ($LASTEXITCODE -ne 3) { throw 'R69 unapproved runner bypassed staging guard' }
          $env:RUNNER_ENVIRONMENT='github-hosted'
          python ./lab/independent-peer/r69_native_scope.py --audit-staged
          if ($LASTEXITCODE -ne 0) { throw 'R69 real staged native profiles are unsafe' }
          Write-Host 'R69_NATIVE_SCOPE_STAGED_BEFORE_SCM_PASS'
      - name: Verify application-level UDP receipt and DNS A/AAAA response via GUI admin IPC and SCM services
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          # Untrusted invocation must fail before any audit of host network state.
          $env:ORACLE_R70_NATIVE_SCOPE = 'CI_ONLY'
          if ('${{ github.head_ref }}' -eq 'test/r73-ci-native-manager-crash-recovery-20261017') {
            $env:ORACLE_R73_RECOVERY = 'CI_ONLY'
          }
          if ('${{ github.head_ref }}' -eq 'test/r74-ci-native-timed-expiry-20261017') {
            $env:ORACLE_R73_RECOVERY = 'CI_ONLY'
            $env:ORACLE_R74_TIMER = 'CI_ONLY'
          }
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $rejected = $false
          try { & ./clients/windows/lab/Test-R70NativeLiveRouteScope.ps1 } catch { $rejected = $true }
          if (-not $rejected) { throw 'R70 host denial bypassed' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          ./clients/windows/lab/run-admin-controlled-scm.ps1
      - name: ALWAYS remove only disposable SCM services, native DLLs and secrets
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup-scm-lab.ps1
      - name: ALWAYS verify IPv4/IPv6 default routes were not changed
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup.ps1
