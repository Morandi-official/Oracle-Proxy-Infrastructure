name: G16 Windows sanitized read-only acceptance baseline

on:
  pull_request:
    paths:
      - 'lab/windows-home/**'
      - '.github/workflows/windows-g16-readonly-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-readonly-baseline:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mock schema and false-claim security regression
        shell: pwsh
        run: |
          ./lab/windows-home/Read-OnlyVpnAcceptance.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'G16 schema self-test failed' }
      - name: Read Windows OS only; verify result never claims production protection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = ./lab/windows-home/Read-OnlyVpnAcceptance.ps1
          $result = $raw | ConvertFrom-Json -ErrorAction Stop
          if ($result.schema_version -ne 1 -or
              $result.mode -ne 'read_only_sanitized_baseline' -or
              $result.network_changes_performed -ne $false -or
              $result.vpn_connection_verified -ne $false -or
              $result.production_install_authorized -ne $false -or
              $result.os_enforced_ipv4_ipv6_dns_fail_closed_verified -ne $false -or
              $result.uu_p2p_identity_or_continuity_verified -ne $false -or
              $result.out_of_band_restore_verified -ne $false) {
            throw 'G16 unsafe claim or schema regression'
          }
          Write-Host 'G16_PASS: real Windows read-only aggregate probe, no VPN/WFP/UU claims'
