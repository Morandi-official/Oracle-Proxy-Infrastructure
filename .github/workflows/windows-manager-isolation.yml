name: Windows privileged manager isolated lab

on:
  pull_request:
    paths:
      - 'clients/windows/manager/**'
      - 'clients/windows/app/**'
      - '.github/workflows/windows-manager-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-manager-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-lab:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile isolated service binary (NO WireGuard driver)
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/manager-lab
          if ($LASTEXITCODE -ne 0) { throw 'Manager compile failed' }
          if (Test-Path ./dist/manager-lab/tunnel.dll) { throw 'Unexpected tunnel DLL' }
          if (Test-Path ./dist/manager-lab/wireguard.dll) { throw 'Unexpected WireGuard driver DLL' }
      - name: Build native GUI client (status-only pipe contract)
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/native-gui-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI integration build failed' }
      - name: Exercise actual Windows named pipe in same-user offline lab
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          & $exe --ipc-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows OS-token pipe tests failed' }
          Write-Host 'PASS: OS-token checked; mutation and forged SID commands rejected'
      - name: Exercise OS-authenticated admin lab control parser (no actual tunnel)
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          $env:GITHUB_ACTIONS = 'true'
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          & $exe --admin-lab-self-test
          if ($LASTEXITCODE -ne 2) { throw 'Release-mode manager unexpectedly exposes admin lab commands' }
          Write-Host 'PASS: default manager binary excludes lab admin-control entrypoints'
          # Explicit negative tests leave a native LASTEXITCODE=2; neutralize after all assertions.
          exit 0
      - name: Validate safe fixed-profile privileged control gate (no OS changes)
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          & $exe --safe-control-gate-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Admin-only fixed-profile protocol regressions failed' }
      - name: R35 native Windows WFP/BFE read-only negative-attestation test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          & $exe --wfp-readonly-self-test
          if ($LASTEXITCODE -ne 0) { throw 'R35 native BFE query or deny-only invariant failed' }
          Write-Host 'R35_NO_WFP_MODIFICATION_PASS: query-only native APIs, no production security attestation'
      - name: R43 native IP Helper IPv4/IPv6 route inventory and independent OS comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          $result = & $exe --native-route-inventory-self-test
          if ($LASTEXITCODE -ne 0) { throw 'R43 native Win32 IP Helper route inventory failed' }
          $line = @($result | Where-Object { $_ -like 'R43_NATIVE_ROUTE_INVENTORY_PASS*' })
          if ($line.Count -ne 1) { throw 'R43 missing or ambiguous native route evidence' }
          if ($line[0] -notmatch '^R43_NATIVE_ROUTE_INVENTORY_PASS ipv4_defaults=(\d+) ipv6_defaults=(\d+) wfp_verified=false operations_enabled=false$') {
            throw 'R43 incorrect native read-only evidence or unexpected log'
          }
          $native4 = [int]$Matches[1]
          $native6 = [int]$Matches[2]
          $os4 = @(Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty InterfaceIndex -Unique).Count
          $os6 = @(Get-NetRoute -DestinationPrefix '::/0' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty InterfaceIndex -Unique).Count
          if ($native4 -ne $os4 -or $native6 -ne $os6) {
            throw 'R43 OS NetTCPIP disagrees with native route interface inventory'
          }
          Write-Host 'R43_WIN32_OS_ROUTE_TABLE_CROSSCHECK_PASS: counts only, no WFP release authorization'
      - name: R45 real BFE reserved filter/sublayer lookup must not attest protection
        shell: pwsh
        run: |
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          & $exe --native-wfp-reserved-filter-self-test
          if ($LASTEXITCODE -ne 0) { throw 'R45 failed native WFP filter/sublayer queries or false GA claims' }
          Write-Host 'R45_NATIVE_WFP_NO_GUARD_PROOF_PASS'
      - name: Reject rogue local STATUS pipe before SCM manager is installed
        shell: pwsh
        run: |
          # The fake pipe is owned by this ordinary CI process, NOT the SCM service.
          $gui = (Resolve-Path './dist/native-gui-smoke/OracleProxy.Windows.Preview.exe').Path
          # WinExe processes do not reliably populate $LASTEXITCODE in pwsh.
          $probe = Start-Process -FilePath $gui -ArgumentList '--manager-spoof-test' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'GUI accepted fake or unverified pipe endpoint' }
          Write-Host 'PASS: SCM manager process PID binding rejects fake status server'
      - name: Install, query, stop and remove STATUS-ONLY LocalSystem service on disposable CI VM
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $svc = 'OracleProxyLabManager'
          $exe = (Resolve-Path './dist/manager-lab/OracleProxy.LabManager.exe').Path
          if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
            throw 'Refuse to modify existing service'
          }
          $created = $false
          try {
            # GitHub-hosted Windows VM only. Start type is DEMAND, never automatic.
            & sc.exe create $svc "binPath=" ("`"{0}`" --manager-service" -f $exe) "start=" "demand" "obj=" "LocalSystem"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create isolated lab service' }
            $created = $true
            & sc.exe start $svc
            if ($LASTEXITCODE -ne 0) { throw 'Failed to start isolated lab service' }
            $s = Get-Service -Name $svc
            $s.WaitForStatus('Running', [TimeSpan]::FromSeconds(15))
            $response = & $exe --ipc-status
            if ($LASTEXITCODE -ne 0) { throw 'Privileged manager IPC unavailable' }
            $json = $response | ConvertFrom-Json
            if (-not $json.ok -or $json.code -ne 'STATUS_ONLY' -or
                $json.manager_mode -ne 'read_only_real_windows_service' -or
                $json.native_dll_loaded -ne $false -or
                $json.leak_protection -ne 'unverified') {
              throw 'Unexpected privileged manager response'
            }
            if (-not $json.authenticated_status_pipe -or $json.mutating_commands_available) {
              throw 'Manager status pipe has wrong access contract'
            }
            $gui = (Resolve-Path './dist/native-gui-smoke/OracleProxy.Windows.Preview.exe').Path
            $client = Start-Process -FilePath $gui -ArgumentList '--manager-status-self-test' -Wait -PassThru
            if ($client.ExitCode -ne 0) {
              throw 'Native GUI failed to read OS-authenticated status-only manager IPC'
            }
            # Valid elevated Windows admin requests reach the SYSTEM gate, but
            # cannot start/stop any real tunnel before WFP is implemented.
            $denials = Start-Process -FilePath $gui -ArgumentList '--manager-control-denial-test' -Wait -PassThru
            if ($denials.ExitCode -ne 0) {
              throw 'Expected OS-token-authenticated SYSTEM control requests to be safely refused'
            }
            Write-Host 'PASS: real SCM manager received and safely denied connect/disconnect requests'
            Write-Host 'PASS: real SCM LocalSystem service and native GUI exchanged authenticated read-only IPC'
          }
          finally {
            if ($created) {
              try { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue } catch {}
              & sc.exe delete $svc
              if ($LASTEXITCODE -ne 0) { Write-Warning 'CI lab SCM cleanup returned an error' }
            }
          }
      - name: Upload unsigned LAB review artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-proxy-windows-manager-status-only-lab
          path: ./dist/manager-lab/**
          if-no-files-found: error
          retention-days: 7
