name: Official WireGuardNT 1.1 DLL ABI smoke (no VPN)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-official-dll-abi.yml'
      - 'clients/windows/service-host/**'
      - 'docs/windows-lab-gates.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-wireguard-nt-abi:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download upstream WireGuardNT SDK only (no installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt-sdk.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 2
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Write-Host "Upstream WireGuardNT SDK v1.1 archive SHA256: $hash"
          if ($hash -ne 'dceb30a9bc4be48cce0f74160fc88a585a2c2627366e8f846fc6658f9038dace') {
            throw 'Upstream WireGuardNT SDK v1.1 archive does not match audited SHA-256'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wg-sdk') -Force
          $dll = Join-Path $env:RUNNER_TEMP 'wg-sdk/wireguard-nt/bin/amd64/wireguard.dll'
          $license = Join-Path $env:RUNNER_TEMP 'wg-sdk/wireguard-nt/LICENSE.txt'
          if (!(Test-Path $dll -PathType Leaf) -or !(Test-Path $license -PathType Leaf)) {
            throw 'Upstream SDK DLL/license structure is missing'
          }
          $driverHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Upstream driver DLL SHA256: $driverHash"
          if ($driverHash -ne 'b1b85e072c45d81358be29d94c599dc76652f912be8c0f0a41e2d5d89a6461d3') {
            throw 'Upstream WireGuardNT AMD64 DLL hash mismatch'
          }
          $sig = Get-AuthenticodeSignature -FilePath $dll
          Write-Host "Authenticode certificate status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw 'Unsigned/untrusted upstream DLL' }
          # One-step-only environment link. Never upload the DLL or SDK ZIP.
          "WGNT_DLL_PATH=$dll" >> $env:GITHUB_ENV
      - name: Probe exports of genuine official native DLL (without calling driver APIs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = $env:WGNT_DLL_PATH
          $handle = [IntPtr]::Zero
          try {
            $handle = [System.Runtime.InteropServices.NativeLibrary]::Load($dll)
            if ($handle -eq [IntPtr]::Zero) { throw 'Official DLL cannot load' }
            foreach ($export in @('WireGuardOpenAdapter', 'WireGuardCloseAdapter', 'WireGuardGetRunningDriverVersion')) {
              $pointer = [System.Runtime.InteropServices.NativeLibrary]::GetExport($handle, $export)
              if ($pointer -eq [IntPtr]::Zero) { throw "Required official export missing: $export" }
            }
            Write-Host 'PASS: actual upstream signed WireGuardNT x64 DLL loads and exposes supported native ABI; no adapter created or driver started'
          }
          finally {
            if ($handle -ne [IntPtr]::Zero) {
              [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
            }
          }

      - name: Native .NET service host must reject unsigned or tampered official DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/service-host/OracleProxy.WireGuardHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r16-trust
          if ($LASTEXITCODE -ne 0) { throw 'Native service host did not compile' }
          $hostExe = (Resolve-Path ./dist/r16-trust/OracleProxy.WireGuardHost.exe).Path
          & $hostExe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Bundle integrity self-test failed' }
          # R67: the distributable/default host may NEVER start an engine
          # from a non-SYSTEM runner or accept an attacker-selected profile.
          # No SCM service, driver adapter or tunnel is installed here.
          & $hostExe --wireguard-service
          if ($LASTEXITCODE -ne 3) { throw 'R67 unprivileged native service unexpectedly admitted' }
          & $hostExe --wireguard-service '../production'
          if ($LASTEXITCODE -ne 2) { throw 'R67 arbitrary native config profile unexpectedly admitted' }
          & $hostExe --ci-sealed-wireguard-service 'lab-only'
          if ($LASTEXITCODE -ne 2) { throw 'R67 default native service retained CI-only sealed entrypoint' }
          Write-Host 'R67_DEFAULT_NATIVE_HOST_UNPRIVILEGED_CONFIG_AND_CI_ENTRYPOINT_DENIAL_PASS'
          & $hostExe --signed-driver-ci-self-test $env:WGNT_DLL_PATH
          if ($LASTEXITCODE -ne 0) { throw 'R16 native signed driver trust/refusal self-test failed' }
          Write-Host 'R16: trusted official driver accepted; unsigned and modified driver refused'
