name: Windows integrated product candidate (not GA)
on:
  pull_request:
    paths: ['clients/windows/product/**', 'server/admin-oracle/relay/settings.py', '.github/workflows/windows-product-candidate.yml']
  push:
    branches: [main]
    paths: ['clients/windows/product/**', 'server/admin-oracle/relay/settings.py', '.github/workflows/windows-product-candidate.yml']
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: windows-2022
    timeout-minutes: 25
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'windows-client-acceptance' || 'windows-product-build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check dedicated acceptance credential presence before building
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $usernamePresent=![string]::IsNullOrWhiteSpace($env:ORACLE_CLIENT_ACCEPTANCE_USERNAME)
          $passwordPresent=![string]::IsNullOrEmpty($env:ORACLE_CLIENT_ACCEPTANCE_PASSWORD)
          Write-Host "CLIENT_ACCEPTANCE_USERNAME_PRESENT=$usernamePresent"
          Write-Host "CLIENT_ACCEPTANCE_PASSWORD_PRESENT=$passwordPresent"
          if(!$usernamePresent -or !$passwordPresent){throw 'Set both named Environment secrets in windows-client-acceptance; no login was attempted'}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache/restore@v4
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: oracle-product-go-${{ runner.os }}-1.27.1-${{ hashFiles('clients/windows/product/core/go.mod') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify packaging excludes harnesses and secrets and rejects incomplete licenses
        shell: pwsh
        run: python -m unittest discover -s clients/windows/product/ci -p test_package_candidate.py -v
      - name: Verify bounded download retries and atomic digest failure
        shell: pwsh
        run: ./clients/windows/product/ci/test-official-download.ps1
      - name: Build pinned userspace WireGuard/TUN core from source
        shell: pwsh
        working-directory: clients/windows/product/core
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference='Stop'
          go mod tidy
          if($LASTEXITCODE -ne 0){throw 'Core dependency resolution failed'}
          go mod vendor
          if($LASTEXITCODE -ne 0){throw 'Complete corresponding core sources unavailable'}
          python ../ci/prepare-core-vendor.py
          if($LASTEXITCODE -ne 0){throw 'Pinned Windows route source patch failed'}
          go test -mod=vendor -tags 'with_gvisor,with_wireguard' -v ./...
          if($LASTEXITCODE -ne 0){throw 'Core HTTPS transport tests failed'}
          New-Item -ItemType Directory -Force ../../../../dist/product | Out-Null
          go build -mod=vendor -trimpath -tags 'with_gvisor,with_wireguard' -ldflags '-s -w -buildid=' -o ../../../../dist/product/OracleProxy.Core.exe .
          if($LASTEXITCODE -ne 0){throw 'Core build failed'}
      - uses: actions/cache/save@v4
        if: steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Verify embedded Wintun bytes against official signed x64 release
        shell: pwsh
        run: ./clients/windows/product/ci/verify-wintun.ps1
      - name: Compile owned native WFP boundary with Windows SDK
        shell: cmd
        run: cl.exe /nologo /LD /O2 /W4 /guard:cf /D_WIN32_WINNT=0x0A00 /DUNICODE /D_UNICODE clients\windows\product\native\guard.c /link /OUT:dist\product\OracleProxy.Guard.dll /DYNAMICBASE /NXCOMPAT /Brepro
      - name: Embed immutable native payload hashes and compile self-contained Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pins='./clients/windows/product/BuildPins.cs'
          $body=Get-Content -Raw $pins
          $body=$body.Replace('BUILD_MUST_PIN_CORE',(Get-FileHash './dist/product/OracleProxy.Core.exe' -Algorithm SHA256).Hash.ToLowerInvariant())
          $body=$body.Replace('BUILD_MUST_PIN_GUARD',(Get-FileHash './dist/product/OracleProxy.Guard.dll' -Algorithm SHA256).Hash.ToLowerInvariant())
          [IO.File]::WriteAllText((Resolve-Path $pins),$body)
          dotnet publish ./clients/windows/product/OracleProxy.Product.csproj -c Release -p:DebugType=None -o ./dist/product
          if($LASTEXITCODE -ne 0){throw 'Product build failed'}
          foreach($case in @(@('--self-test',0),@('--service',3),@('--arbitrary-command',2))){
            $result=Start-Process -FilePath (Resolve-Path './dist/product/OracleProxy.exe') -ArgumentList $case[0] -Wait -PassThru
            if($result.ExitCode -ne $case[1]){throw "Product boundary $($case[0]) exited $($result.ExitCode), expected $($case[1])"}
          }
          Write-Host 'PRODUCT_COMPILE_AND_OFFLINE_BOUNDARIES=PASS'
          exit 0
      - name: Build disposable SYSTEM fixture (not shipped)
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/product/ci/OracleProxy.Product.Tests.csproj -c Release -p:DebugType=None -o ./dist/product-tests
          if($LASTEXITCODE -ne 0){throw 'Fixture build failed'}
          cl.exe /nologo /LD /O2 /W4 /guard:cf /D_WIN32_WINNT=0x0A00 /DUNICODE /D_UNICODE clients/windows/product/ci/udp-loss.c /link /OUT:dist/product-tests/OracleProxy.Fault.dll /DYNAMICBASE /NXCOMPAT /Brepro
          if($LASTEXITCODE -ne 0){throw 'Disposable UDP fault build failed'}
          dotnet publish ./clients/windows/product/ci/OracleProxy.BadUpgrade.csproj -c Release -p:DebugType=None -o ./dist/bad-upgrade
          if($LASTEXITCODE -ne 0){throw 'Bad upgrade fixture build failed'}
          Copy-Item ./dist/product/OracleProxy.Core.exe,./dist/product/OracleProxy.Guard.dll ./dist/bad-upgrade
      - name: Real SCM, SYSTEM DPAPI and isolated WireGuard/WFP fault acceptance
        if: github.event.repository.private == false && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        timeout-minutes: 6
        run: ./clients/windows/product/ci/acceptance.ps1
      - name: Always clean up only candidate-owned disposable services and filters
        if: always()
        shell: pwsh
        run: ./clients/windows/product/ci/cleanup.ps1
      - name: Main-only real Oracle exit and account linkage acceptance
        id: oracle-acceptance
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        timeout-minutes: 8
        env:
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: |
          $settings=Get-Content -Raw ./server/admin-oracle/relay/settings.py
          $env:ORACLE_REQUIRE_QUIC=if($settings -match '(?m)^PUBLIC_QUIC_ENABLED = True\s*$'){'true'}else{'false'}
          ./clients/windows/product/ci/oracle-acceptance.ps1
      - name: Assemble allowlisted candidate with licenses and corresponding source
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path ./clients/windows/product/core/vendor/modules.txt)){throw 'Exact compiled vendored source missing'}
          if('${{ steps.oracle-acceptance.outcome }}' -eq 'success'){
            python ./clients/windows/product/ci/package-candidate.py --acceptance-passed
          }else{
            python ./clients/windows/product/ci/package-candidate.py
          }
          if($LASTEXITCODE -ne 0){throw 'Candidate package validation failed'}
      - uses: actions/upload-artifact@v4
        if: success() && steps.oracle-acceptance.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: OracleProxy-0.3.0-rc14-win-x64-unsigned-acceptance-candidate
          path: |
            dist/candidate/*.zip
            !dist/candidate/*-source.zip
            dist/candidate/SHA256SUMS.txt
            dist/candidate/BUILD.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && steps.oracle-acceptance.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: OracleProxy-0.3.0-rc14-corresponding-source
          path: |
            dist/candidate/*-source.zip
            dist/candidate/SHA256SUMS.txt
            dist/candidate/BUILD.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain source build and hashes for review
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='./dist/review'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item ./clients/windows/product/core/go.mod,./clients/windows/product/core/go.sum $out
          Get-ChildItem ./dist/product -File | Where-Object Name -in @('OracleProxy.exe','OracleProxy.Core.exe','OracleProxy.Guard.dll') | ForEach-Object {"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"} | Set-Content "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('dist/review/*') != ''
        with:
          name: Windows-product-build-review-only
          path: dist/review/*
          if-no-files-found: error
          retention-days: 14
  gameviewer-identities:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect official GameViewer versions without running or logging into UU
        shell: pwsh
        run: ./clients/windows/product/ci/inspect-gameviewer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GameViewer-official-binary-identities-review
          path: dist/gameviewer-review/*.json
          retention-days: 14
          if-no-files-found: error
