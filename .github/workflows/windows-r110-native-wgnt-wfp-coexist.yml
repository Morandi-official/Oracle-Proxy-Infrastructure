name: R110 real native WGNT + all-app fixed-target WFP on one disposable Windows runner

on:
  pull_request:
    paths:
      - '.github/workflows/windows-r110-native-wgnt-wfp-coexist.yml'
      - 'clients/windows/lab/run-admin-controlled-scm.ps1'
      - 'docs/r110-live-native-wg-wfp-coexist.md'

permissions:
  contents: read

concurrency:
  group: r110-one-hosted-native-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-denial-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove exact CI branch gate and no product safety bypass
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "test/r110-native-wgnt-wfp-coexist-20261018" clients/windows/lab/run-admin-controlled-scm.ps1
          grep -Fq "R110_FULL_DEVICE_DEFAULT_EGRESS_FAILCLOSE_AND_UU_NOT_TESTED" clients/windows/lab/run-admin-controlled-scm.ps1
          grep -Fq "Test-R31-AllProcessDualStack.ps1" clients/windows/lab/run-admin-controlled-scm.ps1
          grep -Fq "R83" docs/r110-live-native-wg-wfp-coexist.md
          grep -Fq "UnavailableProductionKernel" clients/windows/manager/ProductionVpnCoordinator.cs
          echo R110_CI_ONLY_NO_PRODUCTION_DRIVER_WFP_UNLOCK

  genuine-scoped-wfp-with-live-wireguard:
    needs: source-denial-scope
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/r110-native-wgnt-wfp-coexist-20261018'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ORACLE_R110_INTEGRATED_WFP: CI_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate real PowerShell parser before any toolchain/network download
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path './clients/windows/lab/run-admin-controlled-scm.ps1').Path
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($null -eq $ast -or @($errors).Count -ne 0) {
            throw 'R110 privileged lab orchestration script is not valid PowerShell'
          }
          Write-Host 'R110_POWERSHELL_PARSE_DENIAL_GATE_PASS'
      - uses: actions/checkout@v4
        with:
          repository: WireGuard/wireguard-windows
          ref: 6ece77bc487c8aa697e3c092197621c4f3e5ccb8
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated CI runner and preserve read-only baseline
        shell: pwsh
        run: ./clients/windows/lab/preflight.ps1
      - name: Download and authenticate official signed WireGuardNT and pinned toolchain
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Build exact upstream native tunnel service, authenticated manager, GUI and app probes
        shell: pwsh
        run: ./clients/windows/lab/build-scm-components.ps1
      - name: Create disposable key pairs and stage precisely protected two-peer configurations
        shell: pwsh
        run: |
          ./clients/windows/lab/generate-keys.ps1
          ./clients/windows/lab/stage-scm-lab.ps1
      - name: Negative test rejects all-app WFP outside disposable CI before any mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:RUNNER_ENVIRONMENT='forbidden'
          $env:ORACLE_R31_NARROW_OS_WFP='CI_ONLY'
          $rejected=$false
          try { ./lab/wfp-scoped/Test-R31-AllProcessDualStack.ps1 } catch { $rejected=$true }
          $env:RUNNER_ENVIRONMENT='github-hosted'
          Remove-Item Env:ORACLE_R31_NARROW_OS_WFP -ErrorAction SilentlyContinue
          if (!$rejected) { throw 'R110 all-app WFP mutation accepted forbidden non-CI invocation' }
          if (Get-NetFirewallRule -Name 'OracleProxy-R31-CI-AllApps-FixedDestination' -ErrorAction SilentlyContinue) {
            throw 'R110 unauthorized request left WFP guard'
          }
          Write-Host 'R110_UNAUTHORIZED_ALLAPP_OS_WFP_REFUSED_PASS'
      - name: Real GUI to SYSTEM native WireGuard peers with nested R15 and all-app R31 OS WFP denial and restoration
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          ./lab/wfp-scoped/Test-R15-GuardedScmTunnel.ps1
          if (-not $?) { throw 'R110 authenticated native/WFP co-existence failed' }
          Write-Host 'R110_NATIVE_COHABITATION_FIXED_SCOPE_WITH_DIRECT_RESTORE_PASS'
          Write-Host 'R110_NO_FULL_DEVICE_FAILCLOSE_OR_UU_CLAIM'
      - name: Always refuse residual R15 and R31 test filters
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $left=@(Get-NetFirewallRule -ErrorAction Stop | Where-Object {
            $_.Name -like 'OracleProxy-R15-CI-*' -or
            $_.Name -eq 'OracleProxy-R31-CI-AllApps-FixedDestination'
          })
          if ($left.Count -ne 0) { throw 'R110 stale WFP filters: disposable runner must be discarded' }
          Write-Host 'R110_WFP_TEST_FILTERS_ABSENT_AFTER_RUN'
      - name: Always clean only this lab's tunnel services, adapters, DLLs and key material
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup-scm-lab.ps1
      - name: Always verify Windows IPv4 IPv6 default routes and DNS match original
        if: always()
        shell: pwsh
        run: ./clients/windows/lab/cleanup.ps1
