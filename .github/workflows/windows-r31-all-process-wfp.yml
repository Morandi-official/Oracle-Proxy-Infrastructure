name: R31 narrow all-process dual-stack WFP OS enforcement (no production VPN)

on:
  pull_request:
    paths:
      - 'lab/wfp-scoped/Test-R31-AllProcessDualStack.ps1'
      - '.github/workflows/windows-r31-all-process-wfp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-fixed-destination-guard:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feat/r31-system-all-process-address-family-wfp' || github.event.pull_request.head.ref == 'feature/r37-ci-system-wfp-dualstack-audit')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse rule mutation without exact one-off CI authorization
        shell: pwsh
        run: |
          $env:RUNNER_ENVIRONMENT = 'forbidden'
          $env:ORACLE_R31_NARROW_OS_WFP = 'CI_ONLY'
          $refused = $false
          try { ./lab/wfp-scoped/Test-R31-AllProcessDualStack.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'R31 unauthorized WFP operation succeeded' }
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object DisplayName -eq 'OracleProxy-R31-CI-AllApps-FixedDestination').Count -ne 0) {
            throw 'R31 refusal created a rule'
          }
          Write-Host 'R31_UNAUTHORIZED_OPERATION_REFUSED_PASS'
      - name: Enforce exact IPv4/IPv6 destination scope on ALL applications/protocols and recover
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: github-hosted
          ORACLE_R31_NARROW_OS_WFP: CI_ONLY
          ORACLE_R37_SCOPE_TAMPER: ${{ github.event.pull_request.head.ref == 'feature/r37-ci-system-wfp-dualstack-audit' && 'CI_ONLY' || 'DISABLED' }}
        run: ./lab/wfp-scoped/Test-R31-AllProcessDualStack.ps1
      - name: ALWAYS check exact rule is absent
        if: always()
        shell: pwsh
        run: |
          if (@(Get-NetFirewallRule -ErrorAction Stop | Where-Object DisplayName -eq 'OracleProxy-R31-CI-AllApps-FixedDestination').Count -gt 0) {
            throw 'R31 residual all-application policy'
          }
