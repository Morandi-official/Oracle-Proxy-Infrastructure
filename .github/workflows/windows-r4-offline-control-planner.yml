name: R4 Windows offline authorized VPN-intent control planner only

on:
  pull_request:
    paths:
      - 'clients/windows/manager/**'
      - '.github/workflows/windows-r4-offline-control-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile genuine Windows manager but do NOT install it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r4-privileged-planner
          if ($LASTEXITCODE -ne 0) { throw 'R4 offline control planner compilation failed' }
      - name: Check no live production service controls and strict transition model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './dist/r4-privileged-planner/OracleProxy.LabManager.exe').Path
          & $exe --offline-intent-planner-self-test
          if ($LASTEXITCODE -ne 0) { throw 'R4 offline intent security self-test failed' }
          & $exe --ipc-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Read-only OS identity IPC regression' }
          # Compile-time release build MUST reject even offline-only lab switches.
          $env:GITHUB_ACTIONS = 'true'
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          & $exe --admin-lab-self-test
          if ($LASTEXITCODE -ne 2) { throw 'Default manager unexpectedly contains lab-only admin parser entrypoint' }
          foreach ($name in @('OracleProxyLabManager','WireGuardTunnel$lab-peer-a','WireGuardTunnel$lab-peer-b')) {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
              throw "R4 must not install or start any service: $name"
            }
          }
          Write-Host 'R4_SUCCESS: in-memory fail-safe intent planner, no service, VPN or firewall mutation'
          # Explicit negative tests leave a native LASTEXITCODE=2; neutralize after all assertions.
          exit 0
