name: R40 Windows acceptance preflight is read-only

on:
  pull_request:
    paths:
      - 'lab/windows-packaging/Get-R40ReadOnlyAcceptancePreflight.ps1'
      - '.github/workflows/windows-r40-readonly-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-only:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse without explicit read-only switch
        shell: pwsh
        run: |
          $rejected = $false
          try { ./lab/windows-packaging/Get-R40ReadOnlyAcceptancePreflight.ps1 } catch { $rejected = $true }
          if (-not $rejected) { throw 'Preflight admitted an implicit request' }
      - name: Inspect actual Windows OS state and retain NO host identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = ./lab/windows-packaging/Get-R40ReadOnlyAcceptancePreflight.ps1 -ReviewOnly |
            ConvertFrom-Json -ErrorAction Stop
          if ($json.schema_version -ne 1 -or
              $json.mode -ne 'read_only_local_preflight' -or
              $json.network_mutation_performed -ne $false -or
              $json.production_replacement_approved -ne $false -or
              $json.uu_continuity_verified -ne $false -or
              $json.real_cross_host_capture_verified -ne $false -or
              $json.wfp_all_device_verified -ne $false -or
              $json.signed_installer_verified -ne $false) {
            throw 'R40 local OS snapshot claimed unverified GA evidence'
          }
          Write-Host 'R40_READONLY_PREACCEPTANCE_PASS: live Windows preflight reports no release authorization'
