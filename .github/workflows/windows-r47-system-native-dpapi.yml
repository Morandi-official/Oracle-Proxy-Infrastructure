name: R47 disposable SYSTEM native WireGuardNT DPAPI memory bridge

on:
  pull_request:
    paths:
      - 'clients/windows/manager/**'
      - 'clients/windows/lab/**'
      - '.github/workflows/windows-r47-system-native-dpapi.yml'

permissions:
  contents: read

jobs:
  local-system-native-memory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/r47-ci-system-native-dpapi-bridge'
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      ORACLE_R44_DPAPI_TEST: CI_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Refuse non-disposable OS and capture default routes DNS and firewall
        shell: pwsh
        run: ./clients/windows/lab/preflight.ps1
      - name: Authenticate official signed WireGuardNT DLL and fixed compiler
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Build R44 native DPAPI memory driver using pinned official header
        shell: pwsh
        run: ./clients/windows/lab/compile-test.ps1
      - name: Generate ephemeral X25519 peers sealed by DPAPI before disk
        shell: pwsh
        run: ./clients/windows/lab/generate-keys.ps1
      - name: Build CI-only SYSTEM manager and separately verify release exclusion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:EnableDisposableLabControls=true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r47-manager
          if ($LASTEXITCODE -ne 0) { throw 'R47 opt-in manager build failed' }
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:EnableDisposableLabControls=false -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r47-deny-manager
          if ($LASTEXITCODE -ne 0) { throw 'R47 production manager build failed' }
          $release = (Resolve-Path './dist/r47-deny-manager/OracleProxy.LabManager.exe').Path
          & $release --ci-system-native-dpapi-negative
          if ($LASTEXITCODE -ne 2) { throw 'R47 release executable unexpectedly parsed CI-native command' }
          $lab = (Resolve-Path './dist/r47-manager/OracleProxy.LabManager.exe').Path
          & $lab --manager-service --ci-system-native-dpapi
          if ($LASTEXITCODE -ne 3) { throw 'R47 non-System account allowed CI-native service' }
          exit 0
      - name: Real LocalSystem SCM starts approved native DPAPI-to-WireGuardNT memory peer lab
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              $env:RUNNER_OS -ne 'Windows' -or
              $env:ORACLE_R44_DPAPI_TEST -ne 'CI_ONLY') {
            throw 'R47_REFUSED: disposable Windows CI only'
          }
          $svc = 'OracleProxyLabManager'
          $stage = Join-Path $env:ProgramData 'OracleProxyR47CiOnly'
          $marker = Join-Path $stage '.r47-ci-owned'
          $ownStage = $false
          $ownService = $false
          if ((Test-Path $stage) -or
              (Get-Service -Name $svc -ErrorAction SilentlyContinue)) {
            throw 'R47_REFUSED: preexisting protected staging or service'
          }
          try {
            New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
            $ownStage = $true
            $admin = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
            $system = [Security.Principal.SecurityIdentifier]::new('S-1-5-18')
            $acl = [Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($admin)
            $acl.SetAccessRuleProtection($true,$false)
            foreach ($sid in @($admin,$system)) {
              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                $sid,[Security.AccessControl.FileSystemRights]::FullControl,
                [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
                  [Security.AccessControl.InheritanceFlags]::ObjectInherit,
                [Security.AccessControl.PropagationFlags]::None,
                [Security.AccessControl.AccessControlType]::Allow))
            }
            Set-Acl -LiteralPath $stage -AclObject $acl -ErrorAction Stop
            $srcDll = (Resolve-Path -LiteralPath $env:WG_LAB_DLL -ErrorAction Stop).Path
            $sig = Get-AuthenticodeSignature -LiteralPath $srcDll -ErrorAction Stop
            if ($sig.Status -ne 'Valid') { throw 'R47 official DLL signature unavailable' }
            $srcNative = (Resolve-Path './dist/loopback/wgnt-r44-dpapi-native.exe').Path
            $srcSealed = (Resolve-Path -LiteralPath $env:WG_LAB_EPHEMERAL_KEY_FILE).Path
            foreach ($pair in @(
              @($srcNative,'wgnt-r44-dpapi-native.exe'),
              @($srcDll,'wireguard.dll'),
              @($srcSealed,'wg-r44-session.dpapi'))) {
              $destination = Join-Path $stage $pair[1]
              Copy-Item -LiteralPath $pair[0] -Destination $destination -ErrorAction Stop
              if ((Get-FileHash $pair[0] -Algorithm SHA256).Hash -ne
                  (Get-FileHash $destination -Algorithm SHA256).Hash) {
                throw 'R47 protected staged binary/ciphertext integrity differs'
              }
              if ((Get-Item $destination).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'R47 protected staging contains a reparse point'
              }
            }
            'R47_GITHUB_DISPOSABLE_VM_ONLY' | Set-Content -LiteralPath $marker -Encoding ascii -NoNewline -ErrorAction Stop
            $manager = (Resolve-Path './dist/r47-manager/OracleProxy.LabManager.exe').Path
            $binpath = ('"{0}" --manager-service --ci-system-native-dpapi' -f $manager)
            & sc.exe create $svc 'binPath=' $binpath 'start=' 'demand' 'obj=' 'LocalSystem' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'R47 SCM create failed' }
            $ownService = $true
            $registered = Get-CimInstance Win32_Service -Filter "Name='$svc'"
            if (!$registered -or $registered.StartName -ne 'LocalSystem' -or
                $registered.StartMode -ne 'Manual' -or
                $registered.PathName -notlike '*--ci-system-native-dpapi*') {
              throw 'R47 service identity/command not exact'
            }
            & sc.exe start $svc | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'R47 SCM start failed' }
            (Get-Service -Name $svc).WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            $receiptPath = Join-Path $stage '.r47-result'
            $deadline = [DateTime]::UtcNow.AddSeconds(100)
            while (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -and
                [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 400
            }
            if (!(Test-Path -LiteralPath $receiptPath) -or
                (Get-Content -LiteralPath $receiptPath -Raw).Trim() -ne 'PASS') {
              throw 'R47 real SYSTEM->native DPAPI memory handshake did not succeed'
            }
            if (Test-Path (Join-Path $stage 'wg-lab-session.bin')) {
              throw 'R47 plaintext peer secret file appeared'
            }
            $receiptService = & $manager --ipc-status | ConvertFrom-Json -ErrorAction Stop
            if ($LASTEXITCODE -ne 0 -or !$receiptService.ok -or
                $receiptService.code -ne 'STATUS_ONLY' -or
                $receiptService.mutating_commands_available -or
                $receiptService.leak_protection -ne 'unverified') {
              throw 'R47 manager advertised unsafe production controls'
            }
            Write-Host 'R47_REAL_SYSTEM_NATIVE_DPAPI_WIREGUARDNT_HANDSHAKE_PASS: two ephemeral localhost peers, no plaintext config'
          }
          finally {
            if ($ownService) {
              $registered = Get-CimInstance Win32_Service -Filter "Name='$svc'" -ErrorAction SilentlyContinue
              if (!$registered -or $registered.PathName -notlike '*--ci-system-native-dpapi*') {
                throw 'R47 cannot identify owned service for deletion'
              }
              try { Stop-Service -Name $svc -ErrorAction SilentlyContinue } catch {}
              & sc.exe delete $svc | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'R47 exact service deletion failed' }
              $deadline = [DateTime]::UtcNow.AddSeconds(25)
              while ((Get-Service -Name $svc -ErrorAction SilentlyContinue) -and
                  [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 400 }
              if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
                throw 'R47 owned service persisted'
              }
            }
            if ($ownStage) {
              if (!(Test-Path $marker -PathType Leaf) -or
                  (Get-Content -LiteralPath $marker -Raw).Trim() -ne
                    'R47_GITHUB_DISPOSABLE_VM_ONLY') {
                throw 'R47 ownership marker missing; refuse recursive cleanup'
              }
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction Stop
            }
            if (Test-Path $stage) { throw 'R47 stage survived independent cleanup' }
            Write-Host 'R47_SYSTEM_SCM_STAGE_CLEANUP_PASS'
          }
      - name: ALWAYS remove disposable keys and verify routes DNS firewall and adapters
        if: always()
        shell: pwsh
        run: |
          ./clients/windows/lab/cleanup.ps1
          if (Get-Service OracleProxyLabManager -ErrorAction SilentlyContinue) {
            throw 'R47 service persists; disposable runner rejected'
          }
          if (Test-Path (Join-Path $env:ProgramData 'OracleProxyR47CiOnly')) {
            throw 'R47 stage persists; disposable runner rejected'
          }
