name: R5 disposable Windows package install and remove status-only service

on:
  pull_request:
    paths:
      - 'lab/windows-packaging/**'
      - '.github/workflows/windows-r5-reversible-package.yml'
      - 'clients/windows/manager/**'
      - 'clients/windows/app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-reversible-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-setup-and-undo:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify client and manager build contains NO native VPN driver or experimental switches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r5-manager
          if ($LASTEXITCODE -ne 0) { throw 'Manager build failed' }
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableDisposableLabControls=false -p:DebugType=None -o ./dist/r5-gui
          if ($LASTEXITCODE -ne 0) { throw 'Read-only GUI build failed' }
          foreach ($file in @('tunnel.dll','wireguard.dll','OracleProxy.WireGuardHost.exe')) {
            if (@(Get-ChildItem ./dist/r5-manager,./dist/r5-gui -File -Recurse | Where-Object Name -eq $file).Count -gt 0) {
              throw 'Native VPN components must not ship in this status-only installation test'
            }
          }
      - name: Negative test - non-CI invocation must refuse before creating anything
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:RUNNER_ENVIRONMENT = 'not-approved'
          $failed=$false
          try {
            ./lab/windows-packaging/Test-DisposableLifecycle.ps1 -ManagerExe ./dist/r5-manager/OracleProxy.LabManager.exe -GuiExe ./dist/r5-gui/OracleProxy.Windows.Preview.exe
          } catch { $failed=$true }
          if (-not $failed) { throw 'R5 installer unexpectedly accepted non-hosted input' }
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          if (Get-Service OracleProxyLabManager -ErrorAction SilentlyContinue) {
            throw 'R5 negative test created an unexpected service'
          }
      - name: Real status-only SCM installation, GUI authentication, uninstall and OS-baseline comparison
        shell: pwsh
        timeout-minutes: 5
        run: ./lab/windows-packaging/Test-DisposableLifecycle.ps1 -ManagerExe ./dist/r5-manager/OracleProxy.LabManager.exe -GuiExe ./dist/r5-gui/OracleProxy.Windows.Preview.exe
      - name: R20 injection at stage create start and safe clean retry
        shell: pwsh
        timeout-minutes: 6
        run: ./lab/windows-packaging/Test-R20-FaultInjection.ps1 -ManagerExe ./dist/r5-manager/OracleProxy.LabManager.exe -GuiExe ./dist/r5-gui/OracleProxy.Windows.Preview.exe
      - name: Always reject any leftover service or staged directory
        if: always()
        shell: pwsh
        run: |
          if (Get-Service -Name OracleProxyLabManager -ErrorAction SilentlyContinue) {
            throw 'R5 leftover SCM manager; discard runner and investigate'
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'OracleProxyR5StatusOnly')) {
            throw 'R5 leftover stage files; discard runner and investigate'
          }
          Write-Host 'R5_POSTCHECK: no service, no staged binaries'
