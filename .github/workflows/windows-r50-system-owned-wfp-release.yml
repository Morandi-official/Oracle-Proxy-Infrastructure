name: R50 separate LocalSystem exact-owned WFP safe-Off lab (disposable CI)

on:
  pull_request:
    paths:
      - 'clients/windows/manager/**'
      - 'clients/windows/lab/**'
      - '.github/workflows/windows-r50-system-owned-wfp-release.yml'
      - 'lab/wfp-scoped/Test-R48-SystemOwnedTargets.ps1'

permissions:
  contents: read

jobs:
  local-system-native-memory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/r50-ci-system-owned-wfp-release'
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      ORACLE_R44_DPAPI_TEST: CI_ONLY
      ORACLE_R48_PACKET_CI: CI_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Refuse non-disposable OS and capture default routes DNS and firewall
        shell: pwsh
        run: ./clients/windows/lab/preflight.ps1
      - name: Authenticate official signed WireGuardNT DLL and fixed compiler
        shell: pwsh
        run: ./clients/windows/lab/prepare-toolchain.ps1
      - name: Build R44 native DPAPI memory driver using pinned official header
        shell: pwsh
        run: ./clients/windows/lab/compile-test.ps1
      - name: Generate ephemeral X25519 peers sealed by DPAPI before disk
        shell: pwsh
        run: ./clients/windows/lab/generate-keys.ps1
      - name: R48 independent baseline before any SYSTEM-owned WFP installation
        shell: pwsh
        run: ./lab/wfp-scoped/Test-R48-SystemOwnedTargets.ps1 -Phase Before
      - name: Build CI-only SYSTEM manager and separately verify release exclusion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:EnableDisposableLabControls=true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r47-manager
          if ($LASTEXITCODE -ne 0) { throw 'R47 opt-in manager build failed' }
          dotnet publish ./clients/windows/manager/OracleProxy.LabManager.csproj -c Release -r win-x64 --self-contained true -p:EnableDisposableLabControls=false -p:PublishSingleFile=true -p:DebugType=None -o ./dist/r47-deny-manager
          if ($LASTEXITCODE -ne 0) { throw 'R47 production manager build failed' }
          $release = (Resolve-Path './dist/r47-deny-manager/OracleProxy.LabManager.exe').Path
          & $release --ci-system-native-dpapi-negative
          if ($LASTEXITCODE -ne 2) { throw 'R47 release executable unexpectedly parsed CI-native command' }
          $lab = (Resolve-Path './dist/r47-manager/OracleProxy.LabManager.exe').Path
          & $lab --ci-r48-address-scope-negative-self-test
          if ($LASTEXITCODE -ne 0) {
            throw 'R48 exact-address canonicalization or broader-range rejection failed'
          }
          & $release --ci-r48-address-scope-negative-self-test
          if ($LASTEXITCODE -ne 2) {
            throw 'R48 normal release unexpectedly includes CI WFP scope test'
          }
          Write-Host 'R48_EXACT_SINGLE_IP_COM_SERIALIZATION_AND_NEGATIVE_SCOPE_PASS'
          & $lab --manager-service --ci-system-native-dpapi
          if ($LASTEXITCODE -ne 3) { throw 'R47 non-System account allowed CI-native service' }
          exit 0
      - name: Real LocalSystem SCM starts approved native DPAPI-to-WireGuardNT memory peer lab
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              $env:RUNNER_OS -ne 'Windows' -or
              $env:ORACLE_R44_DPAPI_TEST -ne 'CI_ONLY') {
            throw 'R47_REFUSED: disposable Windows CI only'
          }
          $svc = 'OracleProxyLabManager'
          $stage = Join-Path $env:ProgramData 'OracleProxyR47CiOnly'
          $marker = Join-Path $stage '.r47-ci-owned'
          $ownStage = $false
          $ownService = $false
          if ((Test-Path $stage) -or
              (Get-Service -Name $svc -ErrorAction SilentlyContinue)) {
            throw 'R47_REFUSED: preexisting protected staging or service'
          }
          try {
            New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
            $ownStage = $true
            $admin = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
            $system = [Security.Principal.SecurityIdentifier]::new('S-1-5-18')
            $acl = [Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($admin)
            $acl.SetAccessRuleProtection($true,$false)
            foreach ($sid in @($admin,$system)) {
              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                $sid,[Security.AccessControl.FileSystemRights]::FullControl,
                [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
                  [Security.AccessControl.InheritanceFlags]::ObjectInherit,
                [Security.AccessControl.PropagationFlags]::None,
                [Security.AccessControl.AccessControlType]::Allow))
            }
            Set-Acl -LiteralPath $stage -AclObject $acl -ErrorAction Stop
            $srcDll = (Resolve-Path -LiteralPath $env:WG_LAB_DLL -ErrorAction Stop).Path
            $sig = Get-AuthenticodeSignature -LiteralPath $srcDll -ErrorAction Stop
            if ($sig.Status -ne 'Valid') { throw 'R47 official DLL signature unavailable' }
            $srcNative = (Resolve-Path './dist/loopback/wgnt-r44-dpapi-native.exe').Path
            $srcSealed = (Resolve-Path -LiteralPath $env:WG_LAB_EPHEMERAL_KEY_FILE).Path
            foreach ($pair in @(
              @($srcNative,'wgnt-r44-dpapi-native.exe'),
              @($srcDll,'wireguard.dll'),
              @($srcSealed,'wg-r44-session.dpapi'))) {
              $destination = Join-Path $stage $pair[1]
              Copy-Item -LiteralPath $pair[0] -Destination $destination -ErrorAction Stop
              if ((Get-FileHash $pair[0] -Algorithm SHA256).Hash -ne
                  (Get-FileHash $destination -Algorithm SHA256).Hash) {
                throw 'R47 protected staged binary/ciphertext integrity differs'
              }
              if ((Get-Item $destination).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'R47 protected staging contains a reparse point'
              }
            }
            'R47_GITHUB_DISPOSABLE_VM_ONLY' | Set-Content -LiteralPath $marker -Encoding ascii -NoNewline -ErrorAction Stop
            $manager = (Resolve-Path './dist/r47-manager/OracleProxy.LabManager.exe').Path
            $binpath = ('"{0}" --manager-service --ci-system-native-dpapi --ci-fixed-destination-wfp' -f $manager)
            & sc.exe create $svc 'binPath=' $binpath 'start=' 'demand' 'obj=' 'LocalSystem' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'R47 SCM create failed' }
            $ownService = $true
            $registered = Get-CimInstance Win32_Service -Filter "Name='$svc'"
            if (!$registered -or $registered.StartName -ne 'LocalSystem' -or
                $registered.StartMode -ne 'Manual' -or
                $registered.PathName -notlike '*--ci-system-native-dpapi*') {
              throw 'R47 service identity/command not exact'
            }
            & sc.exe start $svc | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'R47 SCM start failed' }
            try {
              (Get-Service -Name $svc).WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            }
            catch {
              $diagnostic = Join-Path $stage '.r48-stage'
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $phase = (Get-Content -LiteralPath $diagnostic -Raw).Trim()
                if ($phase -match '^(10|20|30|40|50|60|5[0-9]{3})$') {
                  Write-Host "R48_SYSTEM_WFP_STARTUP_PHASE=$phase"
                }
              }
              else { Write-Host 'R48_SYSTEM_WFP_STARTUP_PHASE=UNAVAILABLE' }
              $remoteFormatPath = Join-Path $stage '.r48-remote-diagnostic'
              if (Test-Path -LiteralPath $remoteFormatPath -PathType Leaf) {
                $remoteFormat = (Get-Content -LiteralPath $remoteFormatPath -Raw).Trim()
                if ($remoteFormat.Length -gt 0 -and $remoteFormat.Length -le 256 -and
                    $remoteFormat -match '^[0-9a-fA-F.:/,; -]+$') {
                  Write-Host "R48_FIXED_PUBLIC_COM_REMOTE_ADDRESS_SERIALIZATION=$remoteFormat"
                }
              }
              throw
            }
            $receiptPath = Join-Path $stage '.r47-result'
            $deadline = [DateTime]::UtcNow.AddSeconds(100)
            while (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -and
                [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 400
            }
            if (!(Test-Path -LiteralPath $receiptPath) -or
                (Get-Content -LiteralPath $receiptPath -Raw).Trim() -ne 'PASS') {
              throw 'R47 real SYSTEM->native DPAPI memory handshake did not succeed'
            }
            if (Test-Path (Join-Path $stage 'wg-lab-session.bin')) {
              throw 'R47 plaintext peer secret file appeared'
            }
            ./lab/wfp-scoped/Test-R48-SystemOwnedTargets.ps1 -Phase During
            $receiptService = & $manager --ipc-status | ConvertFrom-Json -ErrorAction Stop
            if ($LASTEXITCODE -ne 0 -or !$receiptService.ok -or
                $receiptService.code -ne 'STATUS_ONLY' -or
                $receiptService.mutating_commands_available -or
                $receiptService.leak_protection -ne 'unverified') {
              throw 'R47 manager advertised unsafe production controls'
            }
            Write-Host 'R47_REAL_SYSTEM_NATIVE_DPAPI_WIREGUARDNT_HANDSHAKE_PASS: two ephemeral localhost peers, no plaintext config'
          }
          finally {
            if ($ownService) {
              $registered = Get-CimInstance Win32_Service -Filter "Name='$svc'" -ErrorAction SilentlyContinue
              if (!$registered -or $registered.PathName -notlike '*--ci-system-native-dpapi*') {
                throw 'R47 cannot identify owned service for deletion'
              }
              try { Stop-Service -Name $svc -ErrorAction SilentlyContinue } catch {}
              (Get-Service -Name $svc).WaitForStatus('Stopped',[TimeSpan]::FromSeconds(15))

              # R50: separate exact LocalSystem SCM release adapter. Its
              # first startup MUST refuse a missing authorization marker
              # and preserve the persistent WFP rule after stopping VPN.
              $r50Service = 'OracleProxyLabWfpRelease'
              if (Get-Service -Name $r50Service -ErrorAction SilentlyContinue) {
                throw 'R50_REFUSED: preexisting release service'
              }
              $r50Created = $false
              $r50Error = $null
              $r50Phase = 0
              try {
                $r50Phase = 10
                $releasePath = ('"{0}" --manager-service --ci-owned-wfp-release' -f $manager)
                & sc.exe create $r50Service 'binPath=' $releasePath 'start=' 'demand' 'obj=' 'LocalSystem' | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'R50 release service creation refused' }
                $r50Created = $true
                $releaseSvc = Get-CimInstance Win32_Service -Filter "Name='$r50Service'"
                if (!$releaseSvc -or $releaseSvc.StartName -ne 'LocalSystem' -or
                    $releaseSvc.StartMode -ne 'Manual' -or
                    $releaseSvc.PathName -notlike '*--ci-owned-wfp-release*') {
                  throw 'R50 release SCM identity/argument mismatch'
                }
                & sc.exe start $r50Service | Out-Null
                Start-Sleep -Seconds 3
                if ((Get-Service -Name $r50Service).Status -ne 'Stopped' -or
                    (Test-Path (Join-Path $stage '.r50-release-result'))) {
                  throw 'R50 unapproved SYSTEM filter release was admitted'
                }
                ./lab/wfp-scoped/Test-R48-SystemOwnedTargets.ps1 -Phase During
                $r50Phase = 20
                Write-Host 'R50_SYSTEM_RELEASE_WITHOUT_EXPLICIT_APPROVAL_REFUSED_PASS'

                'R50_CI_RELEASE_ONLY' | Set-Content -LiteralPath (
                  Join-Path $stage '.r50-release-approved') -Encoding ascii -NoNewline
                $r50Phase = 30
                & sc.exe start $r50Service | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'R50 approved SCM startup failed' }
                $r50Phase = 40
                (Get-Service -Name $r50Service).WaitForStatus(
                  'Running',[TimeSpan]::FromSeconds(15))
                $r50Phase = 50
                $ownedReceipt = Join-Path $stage '.r50-release-result'
                if (!(Test-Path $ownedReceipt -PathType Leaf) -or
                    (Get-Content -LiteralPath $ownedReceipt -Raw).Trim() -ne 'PASS') {
                  throw 'R50 SYSTEM owned policy release not proved'
                }
                $r50Phase = 60
                if (@(Get-NetFirewallRule -ErrorAction Stop |
                    Where-Object DisplayName -eq
                      'OracleProxy-R48-CI-SYSTEM-AllApps-FixedDestinations').Count -ne 0) {
                  throw 'R50 SYSTEM release left owned WFP record'
                }
                $r50Phase = 70
                Write-Host 'R50_EXPLICIT_SYSTEM_OWNED_WFP_RELEASE_PASS'
              }
              catch {
                $r50Error = $_
                Write-Host "R50_CI_RELEASE_STAGE_FAILED=$r50Phase"
                $remaining = @(Get-NetFirewallRule -ErrorAction Stop |
                  Where-Object DisplayName -eq 'OracleProxy-R48-CI-SYSTEM-AllApps-FixedDestinations').Count
                Write-Host "R50_CI_OWNED_FILTER_REMAINS=$remaining"
              }
              finally {
                if ($r50Created) {
                  $ownedRelease = Get-CimInstance Win32_Service -Filter "Name='$r50Service'"
                  if (!$ownedRelease -or
                      $ownedRelease.PathName -notlike '*--ci-owned-wfp-release*') {
                    throw 'R50 unsafe release service identity on teardown'
                  }
                  try { Stop-Service -Name $r50Service -ErrorAction SilentlyContinue } catch {}
                  & sc.exe delete $r50Service | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw 'R50 release SCM delete failed' }
                  $limit = [DateTime]::UtcNow.AddSeconds(20)
                  while ((Get-Service -Name $r50Service -ErrorAction SilentlyContinue) -and
                      [DateTime]::UtcNow -lt $limit) {
                    Start-Sleep -Milliseconds 350
                  }
                  if (Get-Service -Name $r50Service -ErrorAction SilentlyContinue) {
                    throw 'R50 residual release SCM service'
                  }
                }
              }
              & sc.exe delete $svc | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'R47 exact service deletion failed' }
              $deadline = [DateTime]::UtcNow.AddSeconds(25)
              while ((Get-Service -Name $svc -ErrorAction SilentlyContinue) -and
                  [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 400 }
              if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
                throw 'R47 owned service persisted'
              }
            }
            # Persistent SYSTEM-created policy is removed ONLY after
            # the native child and manager service are fully stopped.
            $ruleName = 'OracleProxy-R48-CI-SYSTEM-AllApps-FixedDestinations'
            $matching = @(Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction Stop |
              Where-Object DisplayName -eq $ruleName)
            if ($matching.Count -gt 0) {
              if (!$ownService -or $matching.Count -ne 1 -or
                  $matching[0].Action -ne 'Block' -or
                  $matching[0].Direction -ne 'Outbound') {
                throw 'R48 refuse to remove unexpected or unowned WFP policy'
              }
              $policy = $null
              try {
                $type = [Type]::GetTypeFromProgID('HNetCfg.FwPolicy2',$true)
                $policy = [Activator]::CreateInstance($type)
                $candidates = @($policy.Rules | Where-Object {
                    [string]::Equals([string]$_.Name,$ruleName,
                      [StringComparison]::Ordinal) })
                if ($candidates.Count -ne 1 -or
                    [int]$candidates[0].Action -ne 0 -or
                    [int]$candidates[0].Direction -ne 2 -or
                    [int]$candidates[0].Protocol -ne 256 -or
                    ![string]::IsNullOrWhiteSpace([string]$candidates[0].ApplicationName)) {
                  throw 'R48 COM WFP ownership scope failed, refuse release'
                }
                $policy.Rules.Remove($ruleName)
              }
              finally {
                if ($policy -and [Runtime.InteropServices.Marshal]::IsComObject($policy)) {
                  [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($policy)
                }
              }
            }
            if (@(Get-NetFirewallRule -ErrorAction Stop |
                Where-Object DisplayName -eq $ruleName).Count -ne 0) {
              throw 'R48 owned WFP policy persisted after explicit CI cleanup'
            }
            ./lab/wfp-scoped/Test-R48-SystemOwnedTargets.ps1 -Phase After
            if ($ownStage) {
              if (!(Test-Path $marker -PathType Leaf) -or
                  (Get-Content -LiteralPath $marker -Raw).Trim() -ne
                    'R47_GITHUB_DISPOSABLE_VM_ONLY') {
                throw 'R47 ownership marker missing; refuse recursive cleanup'
              }
              Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction Stop
            }
            if (Test-Path $stage) { throw 'R47 stage survived independent cleanup' }
            if ($r50Error) { throw 'R50 SYSTEM-owned WFP release test refused or failed' }
            Write-Host 'R47_SYSTEM_SCM_STAGE_CLEANUP_PASS'
          }
      - name: ALWAYS remove disposable keys and verify routes DNS firewall and adapters
        if: always()
        shell: pwsh
        run: |
          ./clients/windows/lab/cleanup.ps1
          if (Get-Service OracleProxyLabManager -ErrorAction SilentlyContinue) {
            throw 'R47 service persists; disposable runner rejected'
          }
          if (Get-Service OracleProxyLabWfpRelease -ErrorAction SilentlyContinue) {
            throw 'R50 experimental release service persisted'
          }
          if (Test-Path (Join-Path $env:ProgramData 'OracleProxyR47CiOnly')) {
            throw 'R47 stage persists; disposable runner rejected'
          }
          if (@(Get-NetFirewallRule -ErrorAction Stop |
              Where-Object DisplayName -eq 'OracleProxy-R48-CI-SYSTEM-AllApps-FixedDestinations').Count -gt 0) {
            throw 'R48 SYSTEM all-app WFP rule leaked after CI cleanup'
          }
