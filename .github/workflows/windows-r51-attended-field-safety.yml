name: R51 supervised fixed-target field recovery proof on disposable Windows

on:
  pull_request:
    paths:
      - 'lab/field-windows/**'
      - '.github/workflows/windows-r51-attended-field-safety.yml'

permissions:
  contents: read

jobs:
  supervised-narrow-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/r51-attended-fixed-target-field-safety'
    runs-on: windows-latest
    timeout-minutes: 14
    env:
      ORACLE_R51_FIELD_CI: CI_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R51 builtin Windows PowerShell 5.1 read-only non-disclosure preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $result = ./lab/field-windows/R51-ReadOnlyPreflight.ps1 -ReviewOnly |
            ConvertFrom-Json -ErrorAction Stop
          if ($result.schema_version -ne 1 -or
              $result.network_mutation_performed -ne $false -or
              $result.ready_for_mutation -ne $false -or
              $result.production_tunnel_enabled -ne $false -or
              !$result.bfe_running -or !$result.firewall_service_running -or
              !$result.task_scheduler_running -or
              $result.test_rule_preexists -or $result.rollback_task_preexists) {
            throw 'R51 read-only test claimed unsafe readiness or state'
          }
          Write-Host 'R51_NATIVE_POWERSHELL51_READONLY_PRECHECK_PASS'
      - name: R51 reject unapproved supervised network mutation before any rule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $denied=$false
          try {
            ./lab/field-windows/Invoke-R51AttendedFixedTcpTest.ps1 -Mode AttendedExercise
          } catch { $denied=$true }
          if (!$denied) { throw 'R51 unexpectedly accepted no-approval field mutation' }
          if (@(Get-NetFirewallRule -Name 'OracleProxy-R51-Attended-TCP443-1.1.1.1' -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'R51 unauthorized mode created firewall rule'
          }
          if (Get-ScheduledTask -TaskName 'OracleProxy-R51-SafetyAutoUndo' -ErrorAction SilentlyContinue) {
            throw 'R51 unauthorized mode created recovery task'
          }
          Write-Host 'R51_UNAPPROVED_NETWORK_MUTATION_REFUSED_PASS'
      - name: R51 prove real SYSTEM watchdog canary, narrow TCP denial and exact restoration
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $before=@(Get-NetFirewallRule | Select-Object -ExpandProperty Name | Sort-Object)
          ./lab/field-windows/Invoke-R51AttendedFixedTcpTest.ps1 -Mode CiExercise
          $after=@(Get-NetFirewallRule | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object $before $after).Count -ne 0) {
            throw 'R51 unrelated Windows Firewall inventory drift'
          }
          if (@(Get-NetFirewallRule -Name 'OracleProxy-R51-Attended-TCP443-1.1.1.1' -ErrorAction SilentlyContinue).Count -ne 0 -or
              @(Get-ScheduledTask -TaskName 'OracleProxy-R51-SafetyAutoUndo' -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'R51 residual task or WFP rule after actual traffic test'
          }
          Write-Host 'R51_REAL_WINDOWS_AUTO_UNDO_AND_NETWORK_BASELINE_PASS'
      - name: ALWAYS destroy only R51 lab rule and watchdog on disposable VM
        if: always()
        shell: powershell
        run: |
          $name='OracleProxy-R51-Attended-TCP443-1.1.1.1'
          $task='OracleProxy-R51-SafetyAutoUndo'
          $rules=@(Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue)
          if ($rules.Count -gt 0) {
            $rules | Remove-NetFirewallRule -ErrorAction Stop
          }
          if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) {
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction Stop
          }
          if (@(Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue).Count -ne 0 -or
              @(Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'R51 disposable host still has residual lab policy'
          }
          Write-Host 'R51_EXACT_OWNED_ROLLBACK_AFTER_JOB_PASS'
