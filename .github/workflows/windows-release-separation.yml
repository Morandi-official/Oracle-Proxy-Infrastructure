name: Windows release isolation and unsigned preview package

on:
  pull_request:
    paths:
      - 'clients/windows/app/**'
      - 'clients/windows/lab/build-scm-components.ps1'
      - '.github/workflows/windows-release-separation.yml'
      - 'docs/windows-release-criteria.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build default end-user preview without lab control module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:EnableDisposableLabControls=false -p:IncludeNativeLibrariesForSelfExtract=true -o ./dist/release-preview
          if ($LASTEXITCODE -ne 0) { throw 'Read-only preview build failed' }
          if (!(Test-Path './dist/release-preview/OracleProxy.Windows.Preview.exe')) { throw 'GUI missing' }

      - name: Negative test — spoofing CI variables never enables VPN in default build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path './dist/release-preview/OracleProxy.Windows.Preview.exe').Path
          # Attacker-supplied environmental hints cannot add compiled code.
          $env:GITHUB_ACTIONS = 'true'
          $env:RUNNER_ENVIRONMENT = 'github-hosted'
          foreach ($arg in @('--ci-lab-start-a','--ci-lab-stop-a','--ci-lab-start-b','--ci-lab-stop-b')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru -Wait
            if ($p.ExitCode -ne 2) { throw "Production preview unexpectedly accepted lab command: $arg, exit=$($p.ExitCode)" }
          }
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Read-only preview policy regression' }
          Write-Host 'PASS: lab VPN control code absent from end-user build despite forged CI environment'

      - name: Separate lab-enabled executable is an explicit distinct build
        shell: pwsh
        run: |
          dotnet publish ./clients/windows/app/OracleProxy.Windows.Preview.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:EnableDisposableLabControls=true -o ./dist/CI-INTERNAL-NOT-PACKAGED
          if ($LASTEXITCODE -ne 0) { throw 'CI-only build regression' }
          # No lab artifact is uploaded. This executable is CI-internal only.
          Write-Host 'PASS: explicit lab compile opt-in works but is excluded from the downloadable artifact'

      - name: Release inventory and package allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path './dist/release-preview').Path
          $files = @(Get-ChildItem -LiteralPath $dir -Recurse -File)
          $relative = @($files | ForEach-Object { $_.FullName.Substring($dir.Length + 1).Replace('\','/') })
          $allow = @('OracleProxy.Windows.Preview.exe',
                     'OracleProxy.Windows.Preview.pdb',
                     'diagnostics/Diagnostics.psm1',
                     'diagnostics/Collect-ReadOnly.ps1')
          foreach ($name in $relative) {
            if ($name -notin $allow) { throw "Unreviewed file in unsigned preview: $name" }
          }
          foreach ($required in @('OracleProxy.Windows.Preview.exe','diagnostics/Diagnostics.psm1','diagnostics/Collect-ReadOnly.ps1')) {
            if ($required -notin $relative) { throw "Missing expected file: $required" }
          }
          if ($relative -contains 'OracleProxy.WireGuardHost.exe' -or
              $relative -contains 'OracleProxy.LabManager.exe') {
            throw 'Privileged binaries must not be shipped in preview'
          }
          $sha = (Get-FileHash -Algorithm SHA256 (Join-Path $dir 'OracleProxy.Windows.Preview.exe')).Hash.ToLowerInvariant()
          @(
            'Oracle Proxy Windows — READ-ONLY UNSIGNED PREVIEW'
            'NOT A VPN. NO VPN CONNECTION, KILL SWITCH, UU BYPASS OR LEAK PROTECTION.'
            'Unsigned and not for production installation.'
            'Do not run on the critical UU-dependent remote Windows computer.'
            'This artifact contains only a WinForms status/diagnostics preview.'
            "Application SHA256: $sha"
            "Build commit: $env:GITHUB_SHA"
          ) | Set-Content -LiteralPath (Join-Path $dir 'READ_ME_FIRST.txt') -Encoding utf8
          $manifest = [ordered]@{
            manifest_schema_version = 1
            channel = 'unsigned-read-only-preview'
            commit = $env:GITHUB_SHA
            application_sha256 = $sha
            tunnel_implementation_included = $false
            vpn_connection_functional = $false
            real_kill_switch_implemented = $false
            uu_live_bypass_verified = $false
            signed = $false
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $dir 'build-manifest.json') -Encoding utf8
          Write-Host "PASS: reviewed allowlisted preview contains no engine/service/native driver; SHA256=$sha"

      - name: Upload strictly read-only, unsigned preview ZIP — NOT GA
        uses: actions/upload-artifact@v4
        with:
          name: oracle-proxy-windows-UNSIGNED-READONLY-preview
          path: ./dist/release-preview/**
          if-no-files-found: error
          retention-days: 7
