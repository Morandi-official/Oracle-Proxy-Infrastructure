name: Accepted Windows client real browser WebRTC privacy
on:
  pull_request:
    paths: ['ops/windows-webrtc/**', '.github/workflows/windows-webrtc-acceptance.yml']
  push:
    branches: [main]
    paths: ['ops/windows-webrtc/**', '.github/workflows/windows-webrtc-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  browser-privacy:
    runs-on: windows-2022
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'windows-client-acceptance' || 'windows-product-build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download and verify exact previously accepted rc20 payloads
        run: python ops/windows-webrtc/prepare.py
      - name: Compile non-shipped real Edge permission matrix harness
        run: dotnet publish ops/windows-webrtc/Acceptance.csproj -c Release -p:DebugType=None -o dist/webrtc-tests
      - name: Check physical counters and public Edge page without accounts
        run: ./dist/webrtc-tests/OracleProxy.WebRtc.Acceptance.exe --counter-self-test
      - name: Wait for exact owned test-slot cleanup SSH stage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/windows-webrtc/wait_cleanup.py
      - name: Real Edge permissions and explicit IPv6 STUN through native WireGuard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          ORACLE_CLIENT_ACCEPTANCE_USERNAME: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_USERNAME }}
          ORACLE_CLIENT_ACCEPTANCE_PASSWORD: ${{ secrets.ORACLE_CLIENT_ACCEPTANCE_PASSWORD }}
        run: ./ops/windows-webrtc/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc20-browser-permission-matrix-redacted
          path: dist/webrtc-review/*.json
          if-no-files-found: ignore
          retention-days: 14
