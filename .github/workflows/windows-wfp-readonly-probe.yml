name: R2 Windows WFP read-only API baseline

on:
  pull_request:
    paths:
      - 'clients/windows/wfp-probe/**'
      - '.github/workflows/windows-wfp-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-wfp-readonly:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile WFP BFE read-only probe
        shell: pwsh
        run: |
          dotnet publish './clients/windows/wfp-probe/OracleProxy.WfpReadOnly.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ./dist/wfp-readonly
          if ($LASTEXITCODE -ne 0) { throw 'WFP read-only probe did not compile' }
      - name: Query actual WFP API and compare default routes + firewall rule counts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Snapshot {
            [ordered]@{
              routes = (@(Get-NetRoute -ErrorAction Stop |
                Where-Object { $_.DestinationPrefix -in @('0.0.0.0/0', '::/0') } |
                Select-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric |
                Sort-Object DestinationPrefix,InterfaceIndex,NextHop,RouteMetric |
                ConvertTo-Json -Compress) -join '')
              firewall_rule_count = @(Get-NetFirewallRule -ErrorAction Stop).Count
            }
          }
          $before = Snapshot
          $exe = (Resolve-Path './dist/wfp-readonly/OracleProxy.WfpReadOnly.exe').Path
          $result = & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Actual WFP BFE read-only API open/close failed' }
          $json = $result | ConvertFrom-Json
          if ($json.schema_version -ne 1 -or
              $json.mode -ne 'read_only_bfe_api' -or
              -not $json.wfp_engine_opened -or
              -not $json.wfp_engine_closed -or
              $json.mutating_wfp_calls_performed -or
              $json.firewall_rules_modified -or
              $json.actual_ipv4_ipv6_dns_fail_closed_verified -or
              $json.uu_live_p2p_exception_verified) {
            throw 'WFP observation misrepresented filter or UU status'
          }
          $after = Snapshot
          if ($before.routes -ne $after.routes -or
              $before.firewall_rule_count -ne $after.firewall_rule_count) {
            throw 'Cloud runner default routes or firewall rule count changed'
          }
          Write-Host 'PASS: actual Windows WFP BFE API opened/closed and selected route/firewall smoke unchanged; no filters installed'
