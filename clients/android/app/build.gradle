plugins {
    id 'com.android.application'
}

def signingStorePath = providers.environmentVariable('ANDROID_SIGNING_STORE_PATH')
def signingStorePassword = providers.environmentVariable('ANDROID_SIGNING_KEYSTORE_PASSWORD')
def signingKeyAlias = providers.environmentVariable('ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = providers.environmentVariable('ANDROID_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [signingStorePath, signingStorePassword, signingKeyAlias, signingKeyPassword]
        .every { it.isPresent() && !it.get().isBlank() }

android {
    namespace = 'org.morandi.proxy'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.morandi.proxy'
        minSdk = 29
        targetSdk = 36
        versionCode = 6
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (hasReleaseSigning) {
        signingConfigs {
            production {
                storeFile = file(signingStorePath.get())
                storePassword = signingStorePassword.get()
                keyAlias = signingKeyAlias.get()
                keyPassword = signingKeyPassword.get()
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.production
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs {
            // The Android VpnService uses the WireGuard userspace backend.
            excludes += ['**/libwg.so', '**/libwg-quick.so']
        }
    }

    if (providers.gradleProperty('proxyTestRelease').orNull == 'true') {
        if (!hasReleaseSigning) {
            throw new GradleException('Testing the release APK requires production signing.')
        }
        testBuildType = 'release'
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
