plugins {
    id 'com.android.application'
}

def signingStorePath = providers.environmentVariable('ANDROID_SIGNING_STORE_PATH')
def signingStorePassword = providers.environmentVariable('ANDROID_SIGNING_KEYSTORE_PASSWORD')
def signingKeyAlias = providers.environmentVariable('ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = providers.environmentVariable('ANDROID_SIGNING_KEY_PASSWORD')
def http3ExitProbe = providers.gradleProperty('proxyHttp3ExitProbe').orNull == 'true'
def hasReleaseSigning = [signingStorePath, signingStorePassword, signingKeyAlias, signingKeyPassword]
        .every { it.isPresent() && !it.get().isBlank() }

android {
    namespace = 'org.morandi.proxy'
    compileSdk = 36
    ndkVersion = '27.0.12077973'

    defaultConfig {
        applicationId = 'org.morandi.proxy'
        minSdk = 29
        targetSdk = 36
        versionCode = 7
        versionName = '0.2.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'H3_EXIT_PROOF_ENABLED', http3ExitProbe.toString()
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    if (hasReleaseSigning) {
        signingConfigs {
            production {
                storeFile = file(signingStorePath.get())
                storePassword = signingStorePassword.get()
                keyAlias = signingKeyAlias.get()
                keyPassword = signingKeyPassword.get()
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.production
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs {
            // The Android VpnService uses the WireGuard userspace backend.
            excludes += ['**/libwg.so', '**/libwg-quick.so']
            // The verified AAR already contains stripped, page-aligned native images.
            keepDebugSymbols += ['**/libwg-go.so']
        }
    }

    if (providers.gradleProperty('proxyTestRelease').orNull == 'true') {
        if (!hasReleaseSigning) {
            throw new GradleException('Testing the release APK requires production signing.')
        }
        testBuildType = 'release'
    }
}

configurations {
    upstreamWireGuard {
        canBeConsumed = false
        transitive = false
    }
}

def derivedTunnel = layout.buildDirectory.file('wireguard-native/tunnel.aar')
def sourceTools = rootProject.file('native')
def ndk = androidComponents.sdkComponents.ndkDirectory
def prepareTunnel = tasks.register('prepareWireGuardTunnel', Exec) {
    inputs.files(configurations.upstreamWireGuard)
    inputs.dir(sourceTools)
    inputs.property('ndkVersion', android.ndkVersion)
    outputs.file(derivedTunnel)
    doFirst {
        def python = System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3'
        commandLine python, new File(sourceTools, 'build_tunnel.py'), 'build',
                configurations.upstreamWireGuard.singleFile, ndk.get().asFile, derivedTunnel.get().asFile,
                new File(gradle.gradleUserHomeDir, 'caches/proxy-wireguard-source')
    }
}

dependencies {
    upstreamWireGuard 'com.wireguard.android:tunnel:1.0.20260102@aar'
    implementation files(derivedTunnel).builtBy(prepareTunnel)
    // Runtime dependencies declared by the pinned WireGuard Maven publication.
    runtimeOnly 'androidx.annotation:annotation:1.9.1'
    runtimeOnly 'androidx.collection:collection:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
